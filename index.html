<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chewbbie">
<title>Chewbbie Taller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#6d28d9;--pd:#5b21b6;--pl:#f5f3ff;--pb:#ddd6fe;--tx:#1e1b2e;--mut:#6b7280;--ok:#15803d;--err:#dc2626}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#faf8ff;color:var(--tx)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:14px}
.mt{margin-top:12px}
.err{color:var(--err);font-size:14px;margin:8px 0 0}
.err:empty{display:none}
.ok{color:var(--ok);font-size:14px;margin:8px 0 0}
.ok:empty{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;font-weight:700}

/* Estructura */
.app{min-height:100vh;display:flex}
.side{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--pb);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--pd);margin:0 6px 24px;line-height:1.2}
.marca img{width:44px;height:44px;object-fit:contain;border-radius:10px}
.menu{flex:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;color:#4b5563;margin-bottom:4px;text-align:left}
.menu button:hover{background:var(--pl)}
.menu button.on{background:var(--p);color:#fff}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.usuario{font-size:12px;color:var(--mut);padding:0 8px 8px;word-break:break-all}
.main{flex:1;min-width:0}
main{max-width:960px;margin:0 auto;padding:28px}
.top,.bottom{display:none}

/* Textos y tarjetas */
h1{font-size:24px;color:var(--pd);margin:0 0 18px}
h2{font-size:16px;color:var(--p);margin:0 0 12px}
.card{background:#fff;border:1px solid var(--pb);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(109,40,217,.06)}
.vacio{text-align:center;color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:2px solid #a78bfa;border-color:var(--p)}
input:disabled{background:#f3f4f6;color:#6b7280}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--p);background:var(--p);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn:hover{background:var(--pd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--p);border-color:#c4b5fd}
.btn.sec:hover{background:var(--pl)}
.btn.red{background:#fff;color:var(--err);border-color:#fecaca}
.btn.red:hover{background:#fef2f2}
.btn.sm{padding:7px 12px;font-size:13.5px}
.blq{width:100%;margin-top:12px}

/* Rejillas */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gr.dos{grid-template-columns:1fr 1fr}
.stat{margin-bottom:0}
.stat small{color:var(--mut);font-size:13px;display:block}
.stat b{font-size:26px;color:var(--p);display:block;margin-top:4px}

/* Listas */
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cab h1{margin:0}
.cab2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bt{display:flex;gap:8px;flex-wrap:wrap}
.nom{font-weight:800;font-size:18px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #f1edff;cursor:pointer;border-radius:10px}
.fila:hover{background:var(--pl)}
.fila:last-child{border-bottom:0}
.monto{font-weight:800;color:var(--p);white-space:nowrap}
.placa{display:inline-block;background:var(--p);color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:2px;padding:3px 10px;border-radius:8px;margin-right:6px}
.placa.sm{font-size:12px;padding:2px 8px}
.moto{background:var(--pl);border:1px solid var(--pb);border-radius:14px;padding:12px;margin-top:12px}
.serv{background:#fff;border:1px solid var(--pb);border-radius:12px;padding:6px;margin-top:10px}
.tr{text-align:right;font-size:14px;padding:8px}
.hcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Formulario de factura */
.sino{display:flex;gap:8px}
.sino button{padding:9px 28px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-weight:700;color:#4b5563}
.sino button.on{background:var(--p);border-color:var(--p);color:#fff}
.linea{display:flex;gap:8px;margin-bottom:8px}
.linea input:first-child{flex:1;min-width:0}
.linea .pr{width:130px;flex:none}
.x{border:0;background:none;color:var(--err);font-size:26px;line-height:1;padding:0 8px;border-radius:10px}
.x:hover{background:#fef2f2}
.fl{display:flex;justify-content:space-between;color:var(--mut);padding:3px 0}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--p);color:#fff;border-radius:14px;padding:14px 18px;margin-top:10px}
.total b{font-size:26px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--pl);border:1px solid var(--pb);border-radius:14px;padding:14px}
.info small{display:block;font-size:11px;font-weight:700;color:var(--p);letter-spacing:1px}
.info b{display:block}
.sub{border:1px solid var(--pb);border-radius:14px;padding:14px;display:grid;gap:12px}
.aviso{color:var(--p);font-weight:600;margin:0;font-size:14px}

/* Configuración */
.logoedit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logoedit img{width:84px;height:84px;object-fit:contain;border:1px solid var(--pb);border-radius:14px;padding:4px;background:#fff}

/* Ventanas */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:100;overflow-y:auto;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:520px;margin:10px auto;padding:18px}
.modal.ancho{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h2{margin:0;font-size:18px;color:var(--pd)}
.cerrar{border:0;background:none;font-size:32px;line-height:1;color:#9ca3af}
.acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.prev canvas{width:100%;height:auto;border:1px solid var(--pb);border-radius:10px;display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1e1b2e;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-size:14px;max-width:90%;text-align:center}

/* Acceso y avisos */
.login,.pantalla{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#5b21b6,#7c3aed 60%,#a78bfa)}
.login form{background:#fff;border-radius:24px;width:100%;max-width:380px;padding:28px;display:grid;gap:14px}
.login img{width:84px;height:84px;margin:0 auto;border-radius:20px;display:block}
.login h1{text-align:center;margin:0}
.login p{text-align:center;margin:0}
.pantalla .caja{background:#fff;border-radius:20px;max-width:440px;padding:26px;text-align:center}
.pantalla h2{font-size:20px;color:var(--pd)}
.pantalla p{color:#4b5563;line-height:1.5}

/* Celular */
@media(max-width:800px){
  .side{display:none}
  .top{display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--pb);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));align-items:center;justify-content:space-between}
  .top .marca{margin:0}
  .top .marca img{width:36px;height:36px}
  .top button{border:0;background:none;color:var(--p);font-weight:700}
  main{padding:16px 14px 100px}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--pb);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:10.5px;font-weight:600;color:#9ca3af}
  .bottom button.on{color:var(--p)}
  .g3,.gr{grid-template-columns:1fr}
  .gr.dos{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .linea .pr{width:105px}
  .stat b{font-size:22px}
}
.evidencia-zona{border:2px dashed #a78bfa;border-radius:14px;padding:20px 12px;text-align:center;background:#faf5ff}.evidencia-zona.arrastrando{background:#ede9fe;border-color:#6d28d9}
</style>
</head>
<body>

<!-- Avisos de configuración / carga / error -->
<div id="aviso-pantalla" class="pantalla hidden"></div>

<!-- Acceso -->
<div id="login" class="login hidden">
  <form onsubmit="entrar(event);return false">
    <img class="logo-img" alt="Logo">
    <h1>Chewbbie Taller</h1>
    <p class="mut">Acceso privado</p>
    <div><label for="lg-email">Correo</label><input id="lg-email" type="email" autocomplete="email" required></div>
    <div><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lg-err"></p>
    <button class="btn" id="lg-btn" type="submit">Entrar</button>
  </form>
</div>

<!-- Aplicación -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="marca"><img class="logo-img" alt="Logo"><span class="nombre-taller"></span></div>
    <nav class="menu" id="menu-side"></nav>
    <div class="usuario" id="usuario-side"></div>
    <button class="btn sec" onclick="salir()">Cerrar sesión</button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="marca"><img class="logo-img" alt="Logo"><span class="nombre-taller"></span></div>
      <button onclick="salir()">Salir</button>
    </header>
    <main id="vista"></main>
  </div>
  <nav class="bottom" id="menu-bottom"></nav>
</div>

<div id="modal-root"></div>

<script>
/* =====================================================
   CONEXIÓN CON GOOGLE APPS SCRIPT
   Pega aquí la URL de tu aplicación web (termina en /exec).
   ===================================================== */
const APPS_URL = 'https://script.google.com/macros/s/AKfycbzX00Wbi410RKx_TQbW7QQXE92wxOd5HBeKeG_EoXV-ucdGEi030O52ywf1_O68NE0QGA/exec';

/* ===================== Utilidades ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(Number(n) || 0);
const num4 = n => String(n ?? 0).padStart(4, '0');
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fechaCorta = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fechaLarga = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CO', {day:'2-digit', month:'long', year:'numeric'}); };
const limpiarPlaca = p => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const sumar = (l, k = 'precio') => (l || []).reduce((s, x) => s + (Number(x[k]) || 0), 0);
const pos = v => Math.max(0, Math.round(Number(v) || 0));
const msgErr = e => (e && e.message) || 'Ocurrió un error.';

function toast(t) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

function rr(x, px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}

/* ===================== Estado ===================== */
const CFG_DEF = {nombre_taller:'Chewbbie Taller', telefono:'', direccion:'', nota_pie:'¡Gracias por confiar en nosotros!', insumos_fijo:'', logo_url:null};
const S = {clientes:[], motos:[], facturas:[], ordenes:[], evidencias:[], config:{...CFG_DEF}, usuario:''};
let vista = 'inicio', F = null, ACTIVA = false, ULT = 0;
let qCli = '', qHis = '', HLIM = 50, CFGLOGO;
const ABIERTAS = new Set();
let CV = null, FACT_ACTUAL = null, MODAL_CB = null;
let FACT_FOTOS_PAGINAS = [];

const configurado = /^https:\/\/script\.google\.com\/.+/.test(APPS_URL);

/* Solo se guarda en el dispositivo la "llave" de la sesión, nunca los datos */
const leerToken = () => { try { return localStorage.getItem('ct_token') || ''; } catch (e) { return ''; } };
const guardarToken = t => { try { if (t) localStorage.setItem('ct_token', t); else localStorage.removeItem('ct_token'); } catch (e) {} };
let TOKEN = leerToken();

/* Logo por defecto (se dibuja con código, sin archivos) */
function crearLogoDefecto() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#6d28d9';
  rr(x, 0, 0, 256, 256, 56);
  x.fill();
  x.strokeStyle = '#fff';
  x.lineWidth = 12;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath(); x.arc(82, 170, 30, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(176, 170, 30, 0, Math.PI * 2); x.stroke();
  x.beginPath();
  x.moveTo(82, 170); x.lineTo(116, 108); x.lineTo(152, 108); x.lineTo(176, 170);
  x.moveTo(116, 108); x.lineTo(104, 86); x.lineTo(132, 86);
  x.moveTo(152, 108); x.lineTo(168, 84); x.lineTo(192, 84);
  x.stroke();
  return c.toDataURL('image/png');
}
const LOGO_DEFECTO = crearLogoDefecto();
const logoSrc = () => S.config.logo_url || 'icon-192.png';

function aplicarMarca() {
  document.querySelectorAll('.logo-img').forEach(i => i.src = logoSrc());
  document.querySelectorAll('.nombre-taller').forEach(i => i.textContent = S.config.nombre_taller);
  document.title = S.config.nombre_taller;
}

/* ===================== Servidor (Google Apps Script) ===================== */
async function api(accion, datos) {
  let r;
  try {
    r = await fetch(APPS_URL, {method:'POST', body:JSON.stringify({accion, token:TOKEN, datos:datos || {}})});
  } catch (e) {
    throw new Error('No hay conexión con el servidor. Revisa tu internet.');
  }
  let j;
  try {
    j = await r.json();
  } catch (e) {
    throw new Error('El servidor no respondió bien. Revisa que la implementación esté en "Cualquier persona" y que la URL sea la correcta.');
  }
  if (!j.ok) {
    if (j.sesionExpirada) {
      TOKEN = '';
      guardarToken('');
      if (ACTIVA) mostrarLogin('Tu sesión expiró. Entra de nuevo.');
    }
    throw new Error(j.error || 'Error del servidor.');
  }
  return j.data;
}

function aplicar(r) {
  S.clientes = r.clientes || [];
  S.motos = r.motos || [];
  S.facturas = r.facturas || [];
  S.ordenes = r.ordenes || [];
  S.evidencias = r.evidencias || [];
  if (r.config) S.config = {...CFG_DEF, ...r.config};
  if (r.usuario) S.usuario = r.usuario;
  ULT = Date.now();
}

async function cargarDatos() { aplicar(await api('cargar')); }

async function escribir(accion, datos) {
  const r = await api(accion, datos);
  aplicar(r);
  return r.extra;
}

/* ===================== Acceso ===================== */
function pantallaAviso(html) {
  $('#login').classList.add('hidden');
  $('#app').classList.add('hidden');
  const p = $('#aviso-pantalla');
  p.innerHTML = `<div class="caja">${html}</div>`;
  p.classList.remove('hidden');
}

function mostrarLogin(msg) {
  ACTIVA = false;
  cerrarModal(true);
  $('#aviso-pantalla').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#lg-err').textContent = msg || '';
  document.querySelectorAll('.logo-img').forEach(i => i.src = LOGO_DEFECTO);
}

function mostrarApp() {
  $('#aviso-pantalla').classList.add('hidden');
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  aplicarMarca();
  render();
}

async function entrar(ev) {
  ev.preventDefault();
  const email = $('#lg-email').value.trim();
  const pass = $('#lg-pass').value;
  const b = $('#lg-btn');
  $('#lg-err').textContent = '';
  b.disabled = true;
  b.textContent = 'Entrando...';
  try {
    const r = await api('login', {email, password:pass});
    TOKEN = r.token;
    guardarToken(TOKEN);
    $('#lg-pass').value = '';
    await entrarApp();
  } catch (e) {
    $('#lg-err').textContent = msgErr(e);
  }
  b.disabled = false;
  b.textContent = 'Entrar';
}

async function entrarApp() {
  try {
    await cargarDatos();
  } catch (e) {
    if (!TOKEN) return mostrarLogin('Tu sesión expiró. Entra de nuevo.');
    return pantallaAviso(`<h2>No se pudieron cargar los datos</h2><p>${esc(msgErr(e))}</p><button class="btn" onclick="location.reload()">Reintentar</button>`);
  }
  ACTIVA = true;
  $('#usuario-side').textContent = S.usuario;
  vista = 'inicio';
  mostrarApp();
}

function salir() {
  api('salir').catch(() => {});
  TOKEN = '';
  guardarToken('');
  S.clientes = []; S.motos = []; S.facturas = []; S.ordenes = []; S.evidencias = [];
  S.config = {...CFG_DEF};
  mostrarLogin();
}

/* ===================== Navegación ===================== */
const ICONOS = {
  inicio:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',
  clientes:'M9 4.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .7 3.5 2.6 3.5 5.5',
  nueva:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',
  historial:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',
  config:'M4 7h10M18 7h2M4 17h2M10 17h10M16 5a2 2 0 100 4 2 2 0 000-4zM8 15a2 2 0 100 4 2 2 0 000-4z'
};
const MENU = [['inicio','Inicio'], ['ordenes','Órdenes'], ['clientes','Clientes'], ['historial','Historial'], ['config','Configuración']];
const ico = k => `<svg class="ico" viewBox="0 0 24 24"><path d="${ICONOS[k]}"/></svg>`;

function pintarMenus() {
  const h = MENU.map(([k, t]) => `<button class="${k === vista ? 'on' : ''}" onclick="ir('${k}')">${ico(k)}<span>${t}</span></button>`).join('');
  $('#menu-side').innerHTML = h;
  $('#menu-bottom').innerHTML = h;
}

function ir(v) {
  if (v === 'nueva' && vista !== 'nueva') F = nuevaEstado();
  else if (v === 'nueva' && F && F.id) F = nuevaEstado();
  vista = v;
  render();
  window.scrollTo(0, 0);
}

function irNueva(placa) {
  F = nuevaEstado(placa);
  vista = 'nueva';
  render();
  window.scrollTo(0, 0);
}

function render() {
  pintarMenus();
  const vistas = {inicio:vInicio, ordenes:vOrdenes, clientes:vClientes, nueva:vNueva, historial:vHistorial, config:vConfig};
  $('#vista').innerHTML = vistas[vista]();
  if (vista === 'clientes') pintarClientes();
  if (vista === 'ordenes') pintarOrdenes();
  if (vista === 'historial') pintarHistorial();
  if (vista === 'nueva') { pintarPlaca(); pintarTrabajos(); pintarInsumos(); pintarRep(); calcTotal(); }
}

/* ===================== Ventanas ===================== */
function abrirModal(titulo, html, ancho, alCerrar) {
  cerrarModal(true);
  MODAL_CB = alCerrar || null;
  $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal ${ancho ? 'ancho' : ''}"><div class="mh"><h2>${esc(titulo)}</h2><button type="button" class="cerrar" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
}

function cerrarModal(silencioso) {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
  const cb = MODAL_CB;
  MODAL_CB = null;
  if (cb && !silencioso) cb();
}

/* ===================== INICIO ===================== */
function stat(t, v) { return `<div class="card stat"><small>${esc(t)}</small><b>${esc(v)}</b></div>`; }

function filaFact(f) {
  return `<div class="fila" onclick="verFactura('${f.id}')">
    <div><b>#${num4(f.numero)}</b> <span class="placa sm">${esc(f.placa)}</span>
    <div class="mut">${fechaCorta(f.fecha)} · ${esc(f.cliente_nombre)} · ${esc(f.marca)} ${esc(f.modelo)}</div></div>
    <div class="monto">${pesos(f.total)}</div></div>`;
}

function verFactura(id) {
  const f = S.facturas.find(x => x.id === id);
  if (f) abrirFactura(f);
}

function vInicio() {
  const mes = hoyISO().slice(0, 7);
  const delMes = S.facturas.filter(f => (f.fecha || '').slice(0, 7) === mes);
  const nm = new Date().toLocaleDateString('es-CO', {month:'long', year:'numeric'});
  return `<div class="cab"><h1>Inicio</h1><button class="btn" onclick="ir('ordenes')">+ Nueva orden</button></div>
  <div class="g3">
    ${stat('Total de servicios realizados', S.facturas.length)}
    ${stat('Facturación de ' + nm, pesos(sumar(delMes, 'total')))}
    ${stat('Facturación acumulada', pesos(sumar(S.facturas, 'total')))}
  </div>
  <div class="card"><h2>Últimos servicios</h2>
    ${S.facturas.length ? S.facturas.slice(0, 5).map(filaFact).join('') : '<p class="mut">Todavía no hay facturas. Crea la primera con el botón de arriba.</p>'}
  </div>`;
}

/* ===================== CLIENTES Y MOTOS ===================== */
const motosDe = id => S.motos.filter(m => m.cliente_id === id);

function vClientes() {
  return `<div class="cab"><h1>Clientes y motos</h1><button class="btn" onclick="abrirOrden()">+ Recibir motocicleta</button></div>
  <p class="mut">Consulta las órdenes, trabajos y facturas de cada motocicleta. Las órdenes sin factura también se muestran.</p>
  <input id="q-cli" placeholder="Buscar por placa, nombre o teléfono" value="${esc(qCli)}" oninput="qCli=this.value;pintarClientes()">
  <div class="mt" id="lista-cli"></div>`;
}

function ordenesDePlaca(placa) {
  const p=limpiarPlaca(placa);
  return S.ordenes.filter(o=>limpiarPlaca(o.placa)===p)
    .sort((a,b)=>String(b.ingreso||'').localeCompare(String(a.ingreso||'')));
}
function facturasDePlaca(placa) {
  const p=limpiarPlaca(placa);
  return S.facturas.filter(f=>limpiarPlaca(f.placa)===p)
    .sort((a,b)=>Number(b.numero)-Number(a.numero));
}
function pintarClientes() {
  const t=qCli.trim().toLowerCase(), p=limpiarPlaca(qCli);
  const normales=S.clientes.filter(c=>!t || c.nombre.toLowerCase().includes(t)
    || (c.telefono||'').includes(t)
    || (p && motosDe(c.id).some(m=>m.placa.includes(p)))
    || S.ordenes.some(o=>o.cliente_nombre.toLowerCase()===c.nombre.toLowerCase()
       && (limpiarPlaca(o.placa).includes(p)||o.cliente_nombre.toLowerCase().includes(t))));
  const placasExistentes=new Set(S.motos.map(m=>limpiarPlaca(m.placa)));
  const extras=S.ordenes.filter(o=>o.placa && !placasExistentes.has(limpiarPlaca(o.placa)))
    .filter((o,i,l)=>l.findIndex(x=>limpiarPlaca(x.placa)===limpiarPlaca(o.placa))===i)
    .filter(o=>!t || limpiarPlaca(o.placa).includes(p) || o.cliente_nombre.toLowerCase().includes(t)
      || (o.cliente_telefono||'').includes(t));
  const html=normales.map(tarjetaCliente).join('') +
    extras.map(o=>`<div class="card"><div class="nom">${esc(o.cliente_nombre||'Cliente sin nombre')}</div>
      <div class="mut">${esc(o.cliente_telefono||'')}</div>
      ${bloqueMoto({id:'orden-'+o.id,placa:o.placa,marca:o.marca,modelo:o.modelo,cliente_id:''})}</div>`).join('');
  $('#lista-cli').innerHTML=html || '<div class="card vacio">No hay clientes ni órdenes para esta búsqueda.</div>';
}
function tarjetaCliente(c) {
  const ms=motosDe(c.id);
  return `<div class="card">
    <div class="cab2">
      <div><div class="nom">${esc(c.nombre)}</div><div class="mut">${esc(c.telefono)||'Sin teléfono'}</div></div>
      <div class="bt">
        <button class="btn sec sm" onclick="modalCliente('${c.id}')">Editar</button>
        <button class="btn sec sm" onclick="modalMoto('${c.id}')">+ Moto</button>
        <button class="btn red sm" onclick="eliminarCliente('${c.id}')">Eliminar</button>
      </div>
    </div>
    ${ms.length?ms.map(bloqueMoto).join(''):'<p class="mut">Sin motos registradas.</p>'}
  </div>`;
}
function bloqueMoto(m) {
  const placa=limpiarPlaca(m.placa), abierta=ABIERTAS.has(placa);
  const ordenes=ordenesDePlaca(placa), facturas=facturasDePlaca(placa);
  let det='';
  if(abierta){
    const ordenHtml=ordenes.map(o=>{
      const realizados=(o.trabajos||[]).filter(t=>t.hecho);
      const pendientes=(o.trabajos||[]).filter(t=>!t.hecho);
      const evid=S.evidencias.filter(f=>f.orden_id===o.id).length;
      return `<div class="card" style="margin:10px 0;padding:12px">
        <div class="cab2"><div><b>Orden ${fechaCorta(o.ingreso)}</b> · ${esc(o.estado)}
          <div class="mut">${esc(o.motivo||'Sin problema reportado')}</div></div>
          <button class="btn sec sm" onclick="abrirOrden('${o.id}')">Ver orden y fotos${evid?' ('+evid+')':''}</button>
        </div>
        ${realizados.length?`<div class="mut mt"><b>Trabajos realizados:</b></div>
          ${realizados.map(t=>`<div class="fl"><span>${esc(t.descripcion)}</span><span>${pesos(t.precio)}</span></div>`).join('')}`:'<div class="mut mt">Sin trabajos marcados como realizados.</div>'}
        ${pendientes.length?`<div class="mut mt">Pendientes: ${esc(pendientes.map(t=>t.descripcion).filter(Boolean).join(', ')||'Sin descripción')}</div>`:''}
        ${Number(o.insumos)>0?`<div class="fl"><span>Insumos</span><span>${pesos(o.insumos)}</span></div>`:''}
        ${(o.repuestos||[]).length?`<div class="mut mt">Repuestos: ${esc(o.repuestos.map(r=>r.nombre).filter(Boolean).join(', '))}</div>`:''}
        ${o.factura_id?`<button class="btn sm mt" onclick="abrirFacturaOrden('${o.factura_id}')">Ver factura</button>`:
          o.estado==='Finalizada'?`<button class="btn sm mt" onclick="facturarDesdeLista('${o.id}')">Generar factura</button>`:''}
      </div>`;
    }).join('');
    const idsFacturadas=new Set(ordenes.map(o=>o.factura_id).filter(Boolean));
    const antiguas=facturas.filter(f=>!idsFacturadas.has(f.id));
    const factHtml=antiguas.map(f=>`<div class="fila" onclick="verFactura('${f.id}')">
      <div><b>Factura #${num4(f.numero)}</b> · ${fechaCorta(f.fecha)}
      <div class="mut">${esc((f.trabajos||[]).map(t=>t.descripcion).join(', ').slice(0,100))}</div></div>
      <span class="monto">${pesos(f.total)}</span></div>`).join('');
    det=`<div class="serv" style="padding:12px">
      <h2>Órdenes de trabajo (${ordenes.length})</h2>
      ${ordenHtml||'<p class="mut">Todavía no hay órdenes guardadas para esta placa.</p>'}
      <h2 class="mt">Facturas anteriores (${facturas.length})</h2>
      ${factHtml||(!facturas.length?'<p class="mut">Todavía no hay facturas.</p>':'<p class="mut">Las facturas de las órdenes aparecen arriba.</p>')}
      </div>`;
  }
  return `<div class="moto">
    <div class="cab2">
      <div><span class="placa">${esc(placa)}</span> <b>${esc(m.marca)} ${esc(m.modelo)}</b>
      <div class="mut">${ordenes.length} órdenes · ${facturas.length} facturas</div></div>
      <div class="bt">
        <button class="btn sec sm" onclick="alternarServicios('${placa}')">${abierta?'Ocultar historial':'Ver historial'}</button>
        <button class="btn sm" onclick="abrirOrdenParaPlaca('${esc(placa)}')">+ Orden</button>
        ${m.cliente_id?`<button class="btn sec sm" onclick="modalMoto('${m.cliente_id}','${m.id}')">Editar</button>
          <button class="btn red sm" onclick="eliminarMoto('${m.id}')">Eliminar</button>`:''}
      </div>
    </div>${det}</div>`;
}
function alternarServicios(placa) {
  const p=limpiarPlaca(placa);
  if(ABIERTAS.has(p)) ABIERTAS.delete(p); else ABIERTAS.add(p);
  pintarClientes();
}

function modalCliente(id) {
  const c = id ? S.clientes.find(x => x.id === id) : null;
  const moto = c ? '' : `<h2 class="mt">Su moto</h2>
    <label>Placa</label><input id="mc-placa" class="mono" maxlength="7" autocapitalize="characters" oninput="this.value=limpiarPlaca(this.value)">
    <div class="g2 mt"><div><label>Marca</label><input id="mc-marca"></div><div><label>Modelo</label><input id="mc-modelo"></div></div>`;
  abrirModal(c ? 'Editar cliente' : 'Nuevo cliente',
    `<label>Nombre del cliente</label><input id="mc-nombre" value="${esc(c?.nombre)}">
     <div class="mt"><label>Teléfono</label><input id="mc-tel" inputmode="tel" value="${esc(c?.telefono)}"></div>
     ${moto}<p class="err" id="mc-err"></p>
     <div class="acc"><button class="btn sec" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mc-ok" onclick="guardarCliente('${id || ''}')">Guardar</button></div>`);
}

async function guardarCliente(id) {
  const v = k => $('#' + k).value.trim();
  const err = $('#mc-err');
  err.textContent = '';
  const nombre = v('mc-nombre'), tel = v('mc-tel');
  if (!nombre) { err.textContent = 'Escribe el nombre del cliente.'; return; }
  const datos = {id:id || undefined, nombre, telefono:tel};
  if (!id) {
    datos.placa = limpiarPlaca($('#mc-placa').value);
    datos.marca = v('mc-marca');
    datos.modelo = v('mc-modelo');
    if (!datos.placa || !datos.marca || !datos.modelo) { err.textContent = 'Completa la placa, marca y modelo de la moto.'; return; }
    if (S.motos.some(m => m.placa === datos.placa)) { err.textContent = 'Esa placa ya está registrada.'; return; }
  }
  const btn = $('#mc-ok');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    await escribir('clienteGuardar', datos);
    cerrarModal();
    render();
    toast('Guardado');
  } catch (e) {
    err.textContent = msgErr(e);
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

function modalMoto(clienteId, motoId) {
  const m = motoId ? S.motos.find(x => x.id === motoId) : null;
  abrirModal(m ? 'Editar moto' : 'Agregar moto',
    `<label>Placa</label><input id="mm-placa" class="mono" maxlength="7" autocapitalize="characters" value="${esc(m?.placa)}" oninput="this.value=limpiarPlaca(this.value)">
     <div class="g2 mt"><div><label>Marca</label><input id="mm-marca" value="${esc(m?.marca)}"></div><div><label>Modelo</label><input id="mm-modelo" value="${esc(m?.modelo)}"></div></div>
     <p class="err" id="mm-err"></p>
     <div class="acc"><button class="btn sec" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mm-ok" onclick="guardarMoto('${clienteId}','${motoId || ''}')">Guardar</button></div>`);
}

async function guardarMoto(clienteId, motoId) {
  const err = $('#mm-err');
  err.textContent = '';
  const placa = limpiarPlaca($('#mm-placa').value);
  const marca = $('#mm-marca').value.trim();
  const modelo = $('#mm-modelo').value.trim();
  if (!placa || !marca || !modelo) { err.textContent = 'Completa la placa, marca y modelo.'; return; }
  if (S.motos.some(m => m.placa === placa && m.id !== motoId)) { err.textContent = 'Esa placa ya está registrada.'; return; }
  const btn = $('#mm-ok');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    await escribir('motoGuardar', {id:motoId || undefined, cliente_id:clienteId, placa, marca, modelo});
    cerrarModal();
    render();
    toast('Guardado');
  } catch (e) {
    err.textContent = msgErr(e);
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

async function eliminarCliente(id) {
  const c = S.clientes.find(x => x.id === id);
  if (!confirm(`¿Eliminar a ${c.nombre} y sus motos? Las facturas ya hechas se conservan en el historial.`)) return;
  try {
    await escribir('clienteEliminar', {id});
    render();
    toast('Cliente eliminado');
  } catch (e) { toast(msgErr(e)); }
}

async function eliminarMoto(id) {
  const m = S.motos.find(x => x.id === id);
  if (!confirm(`¿Eliminar la moto ${m.placa}? Las facturas ya hechas se conservan en el historial.`)) return;
  try {
    await escribir('motoEliminar', {id});
    render();
    toast('Moto eliminada');
  } catch (e) { toast(msgErr(e)); }
}

/* ===================== NUEVA FACTURA ===================== */
function nuevaEstado(placa) {
  return {
    id:null, numero:null, fecha:hoyISO(), placa:limpiarPlaca(placa || ''),
    clienteSel:'', nombre:'', tel:'', marca:'', modelo:'',
    trabajos:[{descripcion:'', precio:''}],
    conInsumos:false, insumos:'',
    conRep:false, repuestos:[{nombre:'', precio:''}]
  };
}

function vNueva() {
  const ed = !!F.id;
  return `<h1>${ed ? 'Editar factura N° ' + num4(F.numero) : 'Registrar servicio y crear factura'}</h1>
  <div class="card"><h2>1. Datos del cliente y la motocicleta</h2><p class="mut">Completa la placa, el cliente y la moto. Si la placa ya existe, mostraremos sus datos automáticamente.</p>
    <div class="gr">
      <div><label>Número</label><input disabled value="${ed ? num4(F.numero) : 'Automático'}"></div>
      <div><label>Fecha</label><input type="date" value="${esc(F.fecha)}" onchange="F.fecha=this.value"></div>
      <div><label>Placa</label><input class="mono" placeholder="ABC12D" maxlength="7" autocomplete="off" autocapitalize="characters" ${ed ? 'disabled' : ''} value="${esc(F.placa)}" oninput="this.value=limpiarPlaca(this.value);F.placa=this.value;pintarPlaca()"></div>
    </div>
    <div class="mt" id="placa-box"></div>
  </div>
  <div class="card"><h2>2. Trabajos realizados</h2><div id="trab-list"></div>
    <button type="button" class="btn sec" onclick="addTrabajo()">+ Agregar trabajo</button></div>
  <div class="card"><h2>3. ¿Se usaron insumos?</h2><div id="ins-box"></div></div>
  <div class="card"><h2>4. ¿Se usaron repuestos?</h2><div id="rep-box"></div></div>
  <div class="card">
    <div id="tot-box"></div>
    <p class="err" id="err-fact"></p>
    <button class="btn blq" id="btn-guardar" onclick="guardarFactura()">${ed ? 'Guardar cambios' : 'Crear factura'}</button>
    ${ed ? '<button class="btn sec blq" onclick="ir(\'historial\')">Cancelar</button>' : ''}
  </div>`;
}

function camposMoto(nueva) {
  const sel = (nueva && S.clientes.length) ? `<div><label>¿Es de un cliente que ya existe?</label>
    <select onchange="F.clienteSel=this.value;pintarPlaca()">
      <option value="">No, es un cliente nuevo</option>
      ${S.clientes.map(c => `<option value="${c.id}" ${F.clienteSel === c.id ? 'selected' : ''}>${esc(c.nombre)}${c.telefono ? ' (' + esc(c.telefono) + ')' : ''}</option>`).join('')}
    </select></div>` : '';
  const cli = (!nueva || !F.clienteSel) ? `<div class="gr dos">
      <div><label>Nombre del cliente</label><input value="${esc(F.nombre)}" oninput="F.nombre=this.value"></div>
      <div><label>Teléfono</label><input inputmode="tel" value="${esc(F.tel)}" oninput="F.tel=this.value"></div>
    </div>` : '';
  return `<div class="sub">
    ${nueva ? '<p class="aviso">Esta placa no está registrada. Completa los datos para registrarla.</p>' : '<p class="mut" style="margin:0">Estos datos aparecen en esta factura.</p>'}
    ${sel}${cli}
    <div class="g2">
      <div><label>Marca de la moto</label><input value="${esc(F.marca)}" oninput="F.marca=this.value"></div>
      <div><label>Modelo</label><input value="${esc(F.modelo)}" oninput="F.modelo=this.value"></div>
    </div></div>`;
}

function pintarPlaca() {
  const box = $('#placa-box');
  if (!box) return;
  if (F.id) { box.innerHTML = camposMoto(false); return; }
  const p = F.placa;
  const m = S.motos.find(x => x.placa === p);
  if (m) {
    const c = S.clientes.find(x => x.id === m.cliente_id) || {};
    box.innerHTML = `<div class="info">
      <div><small>MOTO REGISTRADA</small><b>${esc(m.marca)} ${esc(m.modelo)}</b></div>
      <div><small>CLIENTE</small><b>${esc(c.nombre)}</b><span class="mut">${esc(c.telefono)}</span></div></div>`;
  } else {
    // Los datos del cliente se muestran desde el inicio, sin esperar a escribir la placa.
    box.innerHTML = camposMoto(true);
  }
}

function siNo(v, fn) {
  return `<div class="sino"><button type="button" class="${v ? 'on' : ''}" onclick="${fn}(true)">Sí</button><button type="button" class="${!v ? 'on' : ''}" onclick="${fn}(false)">No</button></div>`;
}

function enfocarUltima(selector) {
  const l = document.querySelectorAll(selector);
  if (l.length) l[l.length - 1].querySelector('input').focus();
}

function pintarTrabajos() {
  $('#trab-list').innerHTML = F.trabajos.map((t, i) => `<div class="linea">
    <input placeholder="Descripción del trabajo" value="${esc(t.descripcion)}" oninput="F.trabajos[${i}].descripcion=this.value">
    <input class="pr" type="number" inputmode="numeric" min="0" placeholder="Precio" value="${esc(t.precio)}" oninput="F.trabajos[${i}].precio=this.value;calcTotal()">
    <button type="button" class="x" onclick="quitarTrabajo(${i})" aria-label="Quitar">×</button></div>`).join('');
}
function addTrabajo() { F.trabajos.push({descripcion:'', precio:''}); pintarTrabajos(); enfocarUltima('#trab-list .linea'); }
function quitarTrabajo(i) {
  F.trabajos = F.trabajos.length === 1 ? [{descripcion:'', precio:''}] : F.trabajos.filter((_, j) => j !== i);
  pintarTrabajos();
  calcTotal();
}

function pintarInsumos() {
  $('#ins-box').innerHTML = siNo(F.conInsumos, 'setIns') + (F.conInsumos
    ? `<div class="mt" style="max-width:320px"><label>Valor fijo de insumos (puedes cambiarlo)</label>
       <input type="number" inputmode="numeric" min="0" placeholder="Ej: 10000" value="${esc(F.insumos)}" oninput="F.insumos=this.value;calcTotal()"></div>` : '');
}
function setIns(v) {
  F.conInsumos = v;
  if (v && F.insumos === '') F.insumos = String(S.config.insumos_fijo || '');
  pintarInsumos();
  calcTotal();
}

function pintarRep() {
  $('#rep-box').innerHTML = siNo(F.conRep, 'setRep') + (F.conRep
    ? `<div class="mt" id="rep-list">${F.repuestos.map((r, i) => `<div class="linea">
        <input placeholder="Nombre del repuesto" value="${esc(r.nombre)}" oninput="F.repuestos[${i}].nombre=this.value">
        <input class="pr" type="number" inputmode="numeric" min="0" placeholder="Precio" value="${esc(r.precio)}" oninput="F.repuestos[${i}].precio=this.value;calcTotal()">
        <button type="button" class="x" onclick="quitarRep(${i})" aria-label="Quitar">×</button></div>`).join('')}</div>
      <button type="button" class="btn sec" onclick="addRep()">+ Agregar repuesto</button>` : '');
}
function setRep(v) { F.conRep = v; pintarRep(); calcTotal(); }
function addRep() { F.repuestos.push({nombre:'', precio:''}); pintarRep(); enfocarUltima('#rep-list .linea'); }
function quitarRep(i) {
  F.repuestos = F.repuestos.length === 1 ? [{nombre:'', precio:''}] : F.repuestos.filter((_, j) => j !== i);
  pintarRep();
  calcTotal();
}

function datosFactura() {
  const tr = F.trabajos.filter(t => t.descripcion.trim() || Number(t.precio)).map(t => ({descripcion:t.descripcion.trim(), precio:pos(t.precio)}));
  const rp = F.conRep ? F.repuestos.filter(r => r.nombre.trim() || Number(r.precio)).map(r => ({nombre:r.nombre.trim(), precio:pos(r.precio)})) : [];
  const ins = F.conInsumos ? pos(F.insumos) : 0;
  return {tr, rp, ins, total:sumar(tr) + ins + sumar(rp)};
}

function calcTotal() {
  const box = $('#tot-box');
  if (!box) return;
  const d = datosFactura();
  let h = `<div class="fl"><span>Trabajos</span><span>${pesos(sumar(d.tr))}</span></div>`;
  if (d.ins > 0) h += `<div class="fl"><span>Insumos</span><span>${pesos(d.ins)}</span></div>`;
  if (d.rp.length) h += `<div class="fl"><span>Repuestos</span><span>${pesos(sumar(d.rp))}</span></div>`;
  h += `<div class="total"><span>TOTAL</span><b>${pesos(d.total)}</b></div>`;
  box.innerHTML = h;
}

async function guardarFactura() {
  const err = $('#err-fact');
  const btn = $('#btn-guardar');

/* ===================== FACTURA: DIBUJO, PDF Y PNG ===================== */
function cargarImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

function envolver(x, texto, max) {
  const palabras = String(texto).split(/\s+/).filter(Boolean);
  const lineas = [];
  let l = '';
  palabras.forEach(pal => {
    let p = pal;
    const t = l ? l + ' ' + p : p;
    if (x.measureText(t).width <= max) { l = t; return; }
    if (l) lineas.push(l);
    while (x.measureText(p).width > max && p.length > 1) {
      let i = p.length;
      while (i > 1 && x.measureText(p.slice(0, i)).width > max) i--;
      lineas.push(p.slice(0, i));
      p = p.slice(i);
    }
    l = p;
  });
  if (l) lineas.push(l);
  return lineas.length ? lineas : [''];
}

function dibujar(x, f, img, W, H) {
  const cfg = S.config;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const set = (size, peso, color) => { x.font = `${peso} ${size}px ${FONT}`; x.fillStyle = color; };
  const ajustado = (txt, max, size, peso, color) => {
    let s = size;
    set(s, peso, color);
    while (s > 12 && x.measureText(txt).width > max) { s--; set(s, peso, color); }
  };
  x.textBaseline = 'alphabetic';

  // Fondo
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, W, H);

  // Encabezado
  x.fillStyle = '#6d28d9';
  x.fillRect(0, 0, W, 150);
  x.fillStyle = '#ffffff';
  rr(x, 40, 35, 80, 80, 16);
  x.fill();
  if (img) {
    const bw = 64;
    const r = Math.min(bw / img.width, bw / img.height);
    const w = img.width * r, h = img.height * r;
    x.drawImage(img, 48 + (bw - w) / 2, 43 + (bw - h) / 2, w, h);
  }
  x.textAlign = 'left';
  ajustado(cfg.nombre_taller, 400, 28, '800', '#ffffff');
  x.fillText(cfg.nombre_taller, 140, 72);
  if (cfg.telefono) { ajustado('Tel: ' + cfg.telefono, 400, 14, '400', '#ddd6fe'); x.fillText('Tel: ' + cfg.telefono, 140, 98); }
  if (cfg.direccion) { ajustado(cfg.direccion, 400, 14, '400', '#ddd6fe'); x.fillText(cfg.direccion, 140, 118); }
  x.textAlign = 'right';
  set(13, '700', '#ddd6fe'); x.fillText('FACTURA', 760, 50);
  set(30, '800', '#ffffff'); x.fillText('N° ' + num4(f.numero), 760, 86);
  set(14, '400', '#ede9fe'); x.fillText(fechaLarga(f.fecha), 760, 112);

  // Cliente y moto
  x.fillStyle = '#f5f3ff';
  rr(x, 40, 175, 720, 96, 16);
  x.fill();
  x.textAlign = 'left';
  set(11, '700', '#6d28d9'); x.fillText('CLIENTE', 64, 200);
  ajustado(f.cliente_nombre || '-', 330, 18, '700', '#1e1b2e'); x.fillText(f.cliente_nombre || '-', 64, 226);
  if (f.cliente_telefono) { set(14, '400', '#6b7280'); x.fillText(f.cliente_telefono, 64, 250); }
  set(11, '700', '#6d28d9'); x.fillText('MOTOCICLETA', 420, 200);
  const mm = [f.marca, f.modelo].filter(Boolean).join(' ') || '-';
  ajustado(mm, 320, 18, '700', '#1e1b2e'); x.fillText(mm, 420, 226);
  set(14, '400', '#6b7280'); x.fillText('Placa: ' + f.placa, 420, 250);

  // Tablas
  let y = 305;
  const tabla = (titulo, col, filas, key) => {
    x.textAlign = 'left';
    set(11, '700', '#6d28d9'); x.fillText(titulo, 40, y);
    y += 8;
    set(13, '600', '#6b7280'); x.fillText(col, 40, y + 16);
    x.textAlign = 'right'; x.fillText('Valor', 760, y + 16);
    x.textAlign = 'left';
    y += 26;
    x.fillStyle = '#ddd6fe'; x.fillRect(40, y, 720, 2);
    y += 6;
    filas.forEach(r => {
      set(15, '400', '#1e1b2e');
      const lineas = envolver(x, r[key] || '', 540);
      lineas.forEach((l, i) => x.fillText(l, 40, y + 20 + i * 20));
      x.textAlign = 'right';
      set(15, '400', '#1e1b2e');
      x.fillText(pesos(r.precio), 760, y + 20);
      x.textAlign = 'left';
      y += lineas.length * 20 + 16;
      x.fillStyle = '#f1edff'; x.fillRect(40, y - 4, 720, 1);
    });
    y += 26;
  };
  tabla('TRABAJOS REALIZADOS', 'Descripción', f.trabajos || [], 'descripcion');
  if ((f.repuestos || []).length) tabla('REPUESTOS', 'Repuesto', f.repuestos, 'nombre');

  // Totales
  const tot = [['Trabajos', sumar(f.trabajos)]];
  if (Number(f.insumos) > 0) tot.push(['Insumos', Number(f.insumos)]);
  if ((f.repuestos || []).length) tot.push(['Repuestos', sumar(f.repuestos)]);
  tot.forEach(([a, b]) => {
    x.textAlign = 'left'; set(14, '400', '#6b7280'); x.fillText(a, 460, y + 14);
    x.textAlign = 'right'; set(14, '400', '#1e1b2e'); x.fillText(pesos(b), 760, y + 14);
    y += 26;
  });
  y += 8;
  x.fillStyle = '#6d28d9';
  rr(x, 440, y, 320, 64, 14);
  x.fill();
  x.textAlign = 'left'; set(15, '700', '#ffffff'); x.fillText('TOTAL', 464, y + 38);
  x.textAlign = 'right'; set(26, '800', '#ffffff'); x.fillText(pesos(f.total), 736, y + 42);
  y += 64;

  // Pie
  x.fillStyle = '#f5f3ff';
  x.fillRect(0, H - 70, W, 70);
  x.textAlign = 'center';
  ajustado(cfg.nota_pie || '¡Gracias por confiar en nosotros!', 700, 15, '700', '#6d28d9');
  x.fillText(cfg.nota_pie || '¡Gracias por confiar en nosotros!', W / 2, H - 28);

  return y + 40 + 70;
}

async function facturaCanvas(f) {
  const img = await cargarImg(logoSrc());
  const W = 800, E = 2;
  const medida = document.createElement('canvas').getContext('2d');
  const H = Math.max(1131, Math.ceil(dibujar(medida, f, img, W, 5000)));
  const c = document.createElement('canvas');
  c.width = W * E;
  c.height = H * E;
  const x = c.getContext('2d');
  x.scale(E, E);
  dibujar(x, f, img, W, H);
  return c;
}


/* Evidencias de la orden asociada a esta factura. Drive sigue privado. */
async function paginasEvidenciasFactura(f) {
  const ordenes=S.ordenes.filter(o=>String(o.factura_id||'')===String(f.id));
  if(!ordenes.length)return [];
  const evidencias=S.evidencias.filter(e=>ordenes.some(o=>o.id===e.orden_id));
  const paginas=[];
  for (const evidencia of evidencias) {
    const r=await api('fotoVer',{id:evidencia.id});
    const img=await cargarImg(r.imagen);
    if(!img)throw new Error('No se pudo cargar la evidencia '+(evidencia.nombre||evidencia.id));
    const c=document.createElement('canvas');
    c.width=800;c.height=1131;
    const x=c.getContext('2d');
    x.fillStyle='#ffffff';x.fillRect(0,0,800,1131);
    x.fillStyle='#6d28d9';x.fillRect(0,0,800,112);
    x.fillStyle='#fff';x.font='bold 27px sans-serif';x.fillText('EVIDENCIA FOTOGRÁFICA',42,55);
    x.font='16px sans-serif';x.fillText('Factura #'+num4(f.numero)+' · Placa '+f.placa,42,86);
    x.fillStyle='#1e1b2e';x.font='bold 19px sans-serif';
    x.fillText((evidencia.etapa||'Durante').slice(0,25),42,151);
    x.font='14px sans-serif';
    const titulo=(evidencia.nombre||'Fotografía').slice(0,80);
    x.fillText(titulo,42,179);
    const maxW=716,maxH=850;
    const factor=Math.min(maxW/img.width,maxH/img.height);
    const iw=img.width*factor, ih=img.height*factor;
    x.drawImage(img,(800-iw)/2,205+(maxH-ih)/2,iw,ih);
    x.fillStyle='#6d28d9';x.fillRect(0,1100,800,31);
    paginas.push(c);
  }
  return paginas;
}

const nombreArchivo = f => `Factura-${num4(f.numero)}-${f.placa}`;

function bajar(blob, nombre) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}

function descargarPNG() {
  if(!CV)return;
  const paginas=[CV,...FACT_FOTOS_PAGINAS];
  if(paginas.length===1){
    CV.toBlob(b=>{if(b)bajar(b,nombreArchivo(FACT_ACTUAL)+'.png');},'image/png');
    return;
  }
  const ancho=Math.max(...paginas.map(c=>c.width));
  const alto=paginas.reduce((n,c)=>n+Math.round(c.height*ancho/c.width),0);
  if(alto>30000){$('#fa-err').textContent='Hay demasiadas fotos para una sola imagen PNG. Descarga el PDF, que contiene todas las evidencias.';return;}
  const unido=document.createElement('canvas');unido.width=ancho;unido.height=alto;
  const x=unido.getContext('2d');let y=0;
  paginas.forEach(c=>{let h=Math.round(c.height*ancho/c.width);x.drawImage(c,0,y,ancho,h);y+=h;});
  unido.toBlob(b=>{if(b)bajar(b,nombreArchivo(FACT_ACTUAL)+'-con-evidencias.png');},'image/png');
}
function descargarPDF() {
  if(!CV)return;
  if(!window.jspdf){$('#fa-err').textContent='No se pudo cargar el generador de PDF.';return;}
  const paginas=[CV,...FACT_FOTOS_PAGINAS];
  const w=595.28;
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:[w,w*paginas[0].height/paginas[0].width],orientation:'portrait'});
  paginas.forEach((c,i)=>{
    const h=w*c.height/c.width;
    if(i)pdf.addPage([w,h],'portrait');
    pdf.addImage(c.toDataURL('image/jpeg',0.88),'JPEG',0,0,w,h);
  });
  pdf.save(nombreArchivo(FACT_ACTUAL)+'.pdf');
}

function leerLogo(archivo) {
  return new Promise((res, rej) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const a = img.naturalWidth || 300, h = img.naturalHeight || 300;
        const e = Math.min(1, 300 / Math.max(a, h));
        const c = document.createElement('canvas');
        c.width = Math.round(a * e);
        c.height = Math.round(h * e);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png'));
      };
      img.onerror = () => rej(new Error('La imagen no es válida.'));
      img.src = lector.result;
    };
    lector.onerror = () => rej(new Error('No se pudo leer el archivo.'));
    lector.readAsDataURL(archivo);
  });
}

  const m=S.motos.find(x=>x.placa===O.placa);
  if(m){const c=S.clientes.find(x=>x.id===m.cliente_id)||{};
    O.marca=m.marca;O.modelo=m.modelo;
    O.cliente_nombre=c.nombre||'';O.cliente_telefono=c.telefono||'';
  }else {
    const prev=ordenesDePlaca(placa)[0];
    if(prev){O.marca=prev.marca;O.modelo=prev.modelo;O.cliente_nombre=prev.cliente_nombre;O.cliente_telefono=prev.cliente_telefono;}
  }
  mostrarOrden();
}
function ordenMoto() {
  if(O.id)return;
  const m=S.motos.find(x=>x.placa===limpiarPlaca(O.placa));
  if(m){const c=S.clientes.find(x=>x.id===m.cliente_id)||{};
    O.marca=m.marca;O.modelo=m.modelo;O.cliente_nombre=c.nombre||'';O.cliente_telefono=c.telefono||'';
  }
  else {const prev=ordenesDePlaca(O.placa)[0];if(prev){
    O.marca=prev.marca;O.modelo=prev.modelo;O.cliente_nombre=prev.cliente_nombre;O.cliente_telefono=prev.cliente_telefono;
  }}
  mostrarOrden();
}
function vOrdenes() {
  return `<div class="cab"><h1>Órdenes de trabajo</h1><button class="btn" onclick="abrirOrden()">+ Recibir motocicleta</button></div>
  <p class="mut">Guarda los trabajos mientras reparas. Genera la factura solo al finalizar.</p>
  <input placeholder="Buscar placa o cliente" value="${esc(QO)}" oninput="QO=this.value;pintarOrdenes()">
  <div id="ordenes-lista" class="mt"></div>`;
}
function pintarOrdenes() {
  const box=$('#ordenes-lista');if(!box)return;
  const filtro=QO.toLowerCase();
  const items=S.ordenes.filter(o=>(o.placa+' '+o.cliente_nombre).toLowerCase().includes(filtro));
  box.innerHTML=items.length?items.map(o=>`<div class="card cab2"><div><span class="placa">${esc(o.placa)}</span>
  <b>${esc(o.marca)} ${esc(o.modelo)}</b><div class="mut">${esc(o.cliente_nombre)} · ${fechaCorta(o.ingreso)} · ${esc(o.estado)}</div>
  <div class="mut">${esc(o.motivo||'Sin motivo registrado')}</div></div>
  <div class="bt">
    <button class="btn sec sm" onclick="abrirOrden('${o.id}')">${o.factura_id?'Ver orden':'Continuar'}</button>
    ${o.factura_id?`<button class="btn sm" onclick="abrirFacturaOrden('${o.factura_id}')">Ver factura</button>`:o.estado==='Finalizada'?`<button class="btn sm" onclick="facturarDesdeLista('${o.id}')">Generar factura</button>`:''}
  </div></div>`).join(''):'<div class="card vacio">Aún no hay órdenes de trabajo.</div>';
}
function lineaOrdenTrabajo(i,t,read) {
  return `<div class="linea" style="align-items:center"><input type="checkbox" style="width:24px;flex:none" ${t.hecho?'checked':''} ${read?'disabled':''} onchange="O.trabajos[${i}].hecho=this.checked">
  <input aria-label="Trabajo" placeholder="Trabajo / revisión" value="${esc(t.descripcion)}" ${read?'disabled':''} oninput="O.trabajos[${i}].descripcion=this.value">
  <input aria-label="Precio" class="pr" type="number" min="0" value="${Number(t.precio)||0}" ${read?'disabled':''} oninput="O.trabajos[${i}].precio=this.value"></div>`;
}
function mostrarOrden() {
  const read=!!O.factura_id;
  const fotos=O.id?S.evidencias.filter(x=>x.orden_id===O.id):[];
  abrirModal('Orden de trabajo · '+(O.placa||'Nueva'),`<div class="sub">
  <div class="g2"><div><label>Placa *</label><input value="${esc(O.placa)}" ${O.id?'disabled':''} oninput="O.placa=limpiarPlaca(this.value);this.value=O.placa" onchange="ordenMoto()"></div>
  <div><label>Fecha de ingreso *</label><input type="date" value="${esc(O.ingreso)}" ${read?'disabled':''} onchange="O.ingreso=this.value"></div></div>
  <div class="g2"><div><label>Cliente *</label><input value="${esc(O.cliente_nombre)}" ${O.id||read?'disabled':''} oninput="O.cliente_nombre=this.value"></div>
  <div><label>Teléfono</label><input value="${esc(O.cliente_telefono)}" ${O.id||read?'disabled':''} oninput="O.cliente_telefono=this.value"></div></div>
  <div class="g2"><div><label>Marca *</label><input value="${esc(O.marca)}" ${O.id||read?'disabled':''} oninput="O.marca=this.value"></div>
  <div><label>Modelo *</label><input value="${esc(O.modelo)}" ${O.id||read?'disabled':''} oninput="O.modelo=this.value"></div></div>
  <label>Problema reportado</label><textarea style="width:100%;min-height:70px" ${read?'disabled':''} oninput="O.motivo=this.value">${esc(O.motivo)}</textarea>
  <label>Estado</label><select ${read?'disabled':''} onchange="O.estado=this.value"><option ${O.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${O.estado==='En proceso'?'selected':''}>En proceso</option><option ${O.estado==='Finalizada'?'selected':''}>Finalizada</option>${read?'<option selected>Facturada</option>':''}</select>
  </div><div class="card mt"><h2>Checklist de trabajos</h2><div id="ot-trabajos"></div>${read?'':'<button class="btn sec sm" onclick="O.trabajos.push({descripcion:\'\',precio:0,hecho:false});pintarOtFilas()">+ Agregar trabajo</button>'}</div>
  <div class="card"><h2>Insumos y repuestos</h2><label>Valor total de insumos</label><input type="number" min="0" value="${Number(O.insumos)||0}" ${read?'disabled':''} oninput="O.insumos=this.value"><div id="ot-repuestos" class="mt"></div>
  ${read?'':'<button class="btn sec sm" onclick="O.repuestos.push({nombre:\'\',precio:0});pintarOtFilas()">+ Agregar repuesto</button>'}</div>
  <div class="card"><h2>Observaciones</h2><textarea style="width:100%;min-height:80px" ${read?'disabled':''} oninput="O.observaciones=this.value">${esc(O.observaciones)}</textarea></div>
  <div class="card"><h2>Fotos de evidencia</h2><p class="mut">Primero guarda la orden. Las fotos se almacenan en Google Drive privado.</p>
  <div id="ot-fotos">${fotos.map(f=>`<div class="fila"><span>${esc(f.etapa)} · ${esc(f.nombre)}</span><div class="bt"><button class="btn sec sm" onclick="verFoto('${f.id}')">Ver</button>${read?'':`<button class="btn red sm" onclick="quitarFoto('${f.id}')">Quitar</button>`}</div></div>`).join('')}</div>
  ${O.id&&!read?`<div class="mt"><label>Momento de la evidencia</label><select id="foto-etapa"><option>Antes</option><option>Durante</option><option>Después</option></select></div>
  <div class="evidencia-zona mt" id="foto-zona" ondragover="fotoDrag(event)" ondragleave="fotoSalir(event)" ondrop="fotoSoltar(event)">
    <p style="margin:0 0 10px">Arrastra una foto aquí o selecciónala:</p>
    <div class="bt" style="justify-content:center"><button type="button" class="btn sec sm" onclick="document.getElementById('foto-archivo').click()">Elegir foto</button>
    <button type="button" class="btn sec sm" onclick="document.getElementById('foto-camara').click()">Tomar foto</button></div>
    <input id="foto-archivo" type="file" accept="image/*" style="display:none" onchange="fotoElegida(this.files)">
    <input id="foto-camara" type="file" accept="image/*" capture="environment" style="display:none" onchange="fotoElegida(this.files)">
    <p id="foto-seleccion" class="mut" style="margin:10px 0 0">Ninguna foto seleccionada</p>
  </div><button type="button" class="btn mt" id="foto-subir" onclick="subirFoto()">Guardar foto en la orden</button>`:''}</div>
  <p class="err" id="ot-error"></p><div class="acc"><button class="btn sec" onclick="cerrarModal()">Cerrar</button>
  ${read?`<button class="btn" onclick="abrirFacturaOrden('${O.factura_id}')">Ver factura</button>`:`<button class="btn" id="ot-guardar" onclick="guardarOrdenUI()">Guardar orden</button>${O.id&&O.estado==='Finalizada'?'<button class="btn" onclick="facturarOrdenUI()">¿Generar factura?</button>':''}`}</div>`,true);
  pintarOtFilas();
}
function pintarOtFilas() {
  const read=!!O.factura_id;
  const tr=$('#ot-trabajos'), rp=$('#ot-repuestos');
  if(tr)tr.innerHTML=O.trabajos.map((t,i)=>lineaOrdenTrabajo(i,t,read)).join('');
  if(rp)rp.innerHTML=O.repuestos.map((r,i)=>`<div class="linea"><input placeholder="Repuesto" value="${esc(r.nombre)}" ${read?'disabled':''} oninput="O.repuestos[${i}].nombre=this.value"><input type="number" min="0" class="pr" value="${Number(r.precio)||0}" ${read?'disabled':''} oninput="O.repuestos[${i}].precio=this.value"></div>`).join('');
}
async function guardarOrdenUI() {
 const e=$('#ot-error'),b=$('#ot-guardar');e.textContent='';
 if(!O.placa||!O.ingreso||!O.cliente_nombre||!O.marca||!O.modelo){e.textContent='Completa los datos de la moto y del cliente.';return;}
 b.disabled=true;
 try {
   const r=await escribir('ordenGuardar',O);
   O=S.ordenes.find(x=>x.id===r.orden_id);
   toast('Orden guardada');
   mostrarOrden();
   if (O.estado==='Finalizada' && !O.factura_id) {
     if (confirm('La orden quedó finalizada y guardada. ¿Deseas generar la factura ahora con estos mismos datos? Puedes elegir Cancelar para facturar después.')) {
       await facturarOrdenUI(true);
     }
   }
 }
 catch(err){e.textContent=msgErr(err);b.disabled=false;}
}
async function facturarDesdeLista(id) {
  const orden=S.ordenes.find(x=>x.id===id);
  if(!orden || orden.estado!=='Finalizada' || orden.factura_id) return;
  abrirOrden(id);
  await facturarOrdenUI();
}
async function facturarOrdenUI(confirmada=false) {
 if(!O?.id || O.estado!=='Finalizada'){toast('Primero selecciona Finalizada y guarda la orden.');return;}
 if(O.factura_id){abrirFacturaOrden(O.factura_id);return;}
 if(!confirmada && !confirm('¿Generar la factura con los datos guardados de esta orden? Se copiarán cliente, moto, trabajos realizados, insumos y repuestos. La orden quedará cerrada para edición.'))return;
 try{
   const r=await escribir('ordenFacturar',{id:O.id,fecha:hoyISO()});
   cerrarModal(true);
   render();
   abrirFacturaOrden(r.factura_id);
 } catch(err){
   const aviso=$('#ot-error');
   if(aviso) aviso.textContent=msgErr(err);
   else toast(msgErr(err));
 }
}
function abrirFacturaOrden(id){const f=S.facturas.find(x=>x.id===id);if(f){cerrarModal(true);abrirFactura(f);}else toast('No se encontró la factura.');}
async function fotoReducida(archivo){
 const url=URL.createObjectURL(archivo);
 try {const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url;});
 const ratio=Math.min(1,1100/Math.max(im.width,im.height));
 const c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 return c.toDataURL('image/jpeg',.72);
 }finally{URL.revokeObjectURL(url);}
}
let FOTO_PENDIENTE = null;
function fotoElegida(files){
 const a=files&&files[0];if(!a)return;
 if(!a.type.startsWith('image/')){toast('Selecciona una imagen válida.');return;}
 FOTO_PENDIENTE=a;
 const el=$('#foto-seleccion');if(el)el.textContent='Seleccionada: '+a.name;
}
function fotoDrag(e){e.preventDefault();e.stopPropagation();$('#foto-zona')?.classList.add('arrastrando');}
function fotoSalir(e){e.preventDefault();e.stopPropagation();$('#foto-zona')?.classList.remove('arrastrando');}
function fotoSoltar(e){
 e.preventDefault();e.stopPropagation();$('#foto-zona')?.classList.remove('arrastrando');
 if(e.dataTransfer?.files?.length)fotoElegida(e.dataTransfer.files);
}
async function subirFoto(){
 const a=FOTO_PENDIENTE;if(!a){toast('Primero elige, toma o arrastra una fotografía.');return;}
 const boton=$('#foto-subir');if(boton){boton.disabled=true;boton.textContent='Guardando foto...';}
 if(!a.type.startsWith('image/')){toast('Elige una imagen.');return;}
 try{const imagen=await fotoReducida(a);await escribir('fotoGuardar',{orden_id:O.id,imagen,nombre:a.name,etapa:$('#foto-etapa').value});FOTO_PENDIENTE=null;O=S.ordenes.find(x=>x.id===O.id);mostrarOrden();toast('Foto guardada');}
 catch(err){$('#ot-error').textContent=msgErr(err);if(boton){boton.disabled=false;boton.textContent='Guardar foto en la orden';}}
}
async function verFoto(id){
 const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para ver la foto.');return;}
 try{const r=await api('fotoVer',{id});w.document.title='Evidencia Chewbbie';const img=w.document.createElement('img');img.style.maxWidth='100%';img.style.height='auto';img.src=r.imagen;w.document.body.appendChild(img);}
 catch(e){w.close();toast(msgErr(e));}
}
async function quitarFoto(id){if(!confirm('¿Eliminar esta evidencia?'))return;
 try{await escribir('fotoEliminar',{id});O=S.ordenes.find(x=>x.id===O.id);mostrarOrden();}
 catch(e){toast(msgErr(e));}}

/* ===================== Inicio de la aplicación ===================== */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !ACTIVA || $('#modal-root').innerHTML) return;
  if (Date.now() - ULT < 30000) return;
  try {
    await cargarDatos();
    if (vista !== 'nueva' && vista !== 'config') render();
  } catch (e) {}
});

async function iniciar() {
  document.querySelectorAll('.logo-img').forEach(i => i.src = LOGO_DEFECTO);
  if (!configurado) {
    return pantallaAviso(`<h2>Falta conectar el servidor</h2>
      <p>Abre el archivo <b>index.html</b> en GitHub y pega la URL de tu aplicación web de Google Apps Script en la línea <b>const APPS_URL</b>.</p>`);
  }
  if (TOKEN) {
    pantallaAviso('<h2>Cargando...</h2><p>Un momento, estamos trayendo tus datos.</p>');
    await entrarApp();
  } else {
    mostrarLogin();
  }
}
iniciar();
</script>
