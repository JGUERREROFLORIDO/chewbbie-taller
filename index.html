<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chewbbie">
<title>Chewbbie Taller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#6d28d9;--pd:#5b21b6;--pl:#f5f3ff;--pb:#ddd6fe;--tx:#1e1b2e;--mut:#6b7280;--ok:#15803d;--err:#dc2626}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#faf8ff;color:var(--tx)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:14px}
.mt{margin-top:12px}
.err{color:var(--err);font-size:14px;margin:8px 0 0}
.err:empty{display:none}
.ok{color:var(--ok);font-size:14px;margin:8px 0 0}
.ok:empty{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;font-weight:700}

/* Estructura */
.app{min-height:100vh;display:flex}
.side{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--pb);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--pd);margin:0 6px 24px;line-height:1.2}
.marca img{width:44px;height:44px;object-fit:contain;border-radius:10px}
.menu{flex:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;color:#4b5563;margin-bottom:4px;text-align:left}
.menu button:hover{background:var(--pl)}
.menu button.on{background:var(--p);color:#fff}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.usuario{font-size:12px;color:var(--mut);padding:0 8px 8px;word-break:break-all}
.main{flex:1;min-width:0}
main{max-width:960px;margin:0 auto;padding:28px}
.top,.bottom{display:none}

/* Textos y tarjetas */
h1{font-size:24px;color:var(--pd);margin:0 0 18px}
h2{font-size:16px;color:var(--p);margin:0 0 12px}
.card{background:#fff;border:1px solid var(--pb);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(109,40,217,.06)}
.vacio{text-align:center;color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:2px solid #a78bfa;border-color:var(--p)}
input:disabled{background:#f3f4f6;color:#6b7280}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--p);background:var(--p);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn:hover{background:var(--pd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--p);border-color:#c4b5fd}
.btn.sec:hover{background:var(--pl)}
.btn.red{background:#fff;color:var(--err);border-color:#fecaca}
.btn.red:hover{background:#fef2f2}
.btn.sm{padding:7px 12px;font-size:13.5px}
.blq{width:100%;margin-top:12px}

/* Rejillas */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gr.dos{grid-template-columns:1fr 1fr}
.stat{margin-bottom:0}
.stat small{color:var(--mut);font-size:13px;display:block}
.stat b{font-size:26px;color:var(--p);display:block;margin-top:4px}

/* Listas */
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cab h1{margin:0}
.cab2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bt{display:flex;gap:8px;flex-wrap:wrap}
.nom{font-weight:800;font-size:18px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #f1edff;cursor:pointer;border-radius:10px}
.fila:hover{background:var(--pl)}
.fila:last-child{border-bottom:0}
.monto{font-weight:800;color:var(--p);white-space:nowrap}
.placa{display:inline-block;background:var(--p);color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:2px;padding:3px 10px;border-radius:8px;margin-right:6px}
.placa.sm{font-size:12px;padding:2px 8px}
.moto{background:var(--pl);border:1px solid var(--pb);border-radius:14px;padding:12px;margin-top:12px}
.serv{background:#fff;border:1px solid var(--pb);border-radius:12px;padding:6px;margin-top:10px}
.tr{text-align:right;font-size:14px;padding:8px}
.hcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Formulario de factura */
.sino{display:flex;gap:8px}
.sino button{padding:9px 28px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-weight:700;color:#4b5563}
.sino button.on{background:var(--p);border-color:var(--p);color:#fff}
.linea{display:flex;gap:8px;margin-bottom:8px}
.linea input:first-child{flex:1;min-width:0}
.linea .pr{width:130px;flex:none}
.x{border:0;background:none;color:var(--err);font-size:26px;line-height:1;padding:0 8px;border-radius:10px}
.x:hover{background:#fef2f2}
.fl{display:flex;justify-content:space-between;color:var(--mut);padding:3px 0}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--p);color:#fff;border-radius:14px;padding:14px 18px;margin-top:10px}
.total b{font-size:26px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--pl);border:1px solid var(--pb);border-radius:14px;padding:14px}
.info small{display:block;font-size:11px;font-weight:700;color:var(--p);letter-spacing:1px}
.info b{display:block}
.sub{border:1px solid var(--pb);border-radius:14px;padding:14px;display:grid;gap:12px}
.aviso{color:var(--p);font-weight:600;margin:0;font-size:14px}

/* Configuración */
.logoedit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logoedit img{width:84px;height:84px;object-fit:contain;border:1px solid var(--pb);border-radius:14px;padding:4px;background:#fff}

/* Ventanas */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:100;overflow-y:auto;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:520px;margin:10px auto;padding:18px}
.modal.ancho{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h2{margin:0;font-size:18px;color:var(--pd)}
.cerrar{border:0;background:none;font-size:32px;line-height:1;color:#9ca3af}
.acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.prev canvas{width:100%;height:auto;border:1px solid var(--pb);border-radius:10px;display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1e1b2e;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-size:14px;max-width:90%;text-align:center}

/* Acceso y avisos */
.login,.pantalla{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#5b21b6,#7c3aed 60%,#a78bfa)}
.login form{background:#fff;border-radius:24px;width:100%;max-width:380px;padding:28px;display:grid;gap:14px}
.login img{width:84px;height:84px;margin:0 auto;border-radius:20px;display:block}
.login h1{text-align:center;margin:0}
.login p{text-align:center;margin:0}
.pantalla .caja{background:#fff;border-radius:20px;max-width:440px;padding:26px;text-align:center}
.pantalla h2{font-size:20px;color:var(--pd)}
.pantalla p{color:#4b5563;line-height:1.5}

/* Celular */
@media(max-width:800px){
  .side{display:none}
  .top{display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--pb);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));align-items:center;justify-content:space-between}
  .top .marca{margin:0}
  .top .marca img{width:36px;height:36px}
  .top button{border:0;background:none;color:var(--p);font-weight:700}
  main{padding:16px 14px 100px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--pb);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:10.5px;font-weight:600;color:#9ca3af}
  .bottom button.on{color:var(--p)}
  .g3,.gr{grid-template-columns:1fr}
  .gr.dos{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .linea .pr{width:105px}
  .stat b{font-size:22px}
}
</style>
</head>
<body>

<!-- Avisos de configuración / error -->
<div id="aviso-pantalla" class="pantalla hidden"></div>

<!-- Acceso -->
<div id="login" class="login hidden">
  <form onsubmit="return entrar(event)">
    <img class="logo-img" alt="Logo">
    <h1>Chewbbie Taller</h1>
    <p class="mut">Acceso privado</p>
    <div><label for="lg-email">Correo</label><input id="lg-email" type="email" autocomplete="email" required></div>
    <div><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lg-err"></p>
    <button class="btn" id="lg-btn" type="submit">Entrar</button>
  </form>
</div>

<!-- Aplicación -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="marca"><img class="logo-img" alt="Logo"><span class="nombre-taller"></span></div>
    <nav class="menu" id="menu-side"></nav>
    <div class="usuario" id="usuario-side"></div>
    <button class="btn sec" onclick="salir()">Cerrar sesión</button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="marca"><img class="logo-img" alt="Logo"><span class="nombre-taller"></span></div>
      <button onclick="salir()">Salir</button>
    </header>
    <main id="vista"></main>
  </div>
  <nav class="bottom" id="menu-bottom"></nav>
</div>

<div id="modal-root"></div>

<script>
/* =====================================================
   CONEXIÓN CON SUPABASE
   Pega aquí tus dos claves (se explica en el siguiente paso).
   La clave "anon" es pública por diseño: la seguridad real
   la dan las políticas (RLS) de la base de datos.
   ===================================================== */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

/* ===================== Utilidades ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(Number(n) || 0);
const num4 = n => String(n ?? 0).padStart(4, '0');
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fechaCorta = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fechaLarga = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CO', {day:'2-digit', month:'long', year:'numeric'}); };
const limpiarPlaca = p => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const sumar = (l, k = 'precio') => (l || []).reduce((s, x) => s + (Number(x[k]) || 0), 0);
const pos = v => Math.max(0, Math.round(Number(v) || 0));
const msgErr = e => (e && e.code === '23505') ? 'Esa placa ya está registrada. Actualiza la página e intenta de nuevo.' : ((e && e.message) || 'Ocurrió un error.');

function toast(t) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

function rr(x, px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}

/* ===================== Estado ===================== */
const CFG_DEF = {nombre_taller:'Chewbbie Taller', telefono:'', direccion:'', nota_pie:'¡Gracias por confiar en nosotros!', logo_url:null};
const S = {clientes:[], motos:[], facturas:[], config:{...CFG_DEF}};
let vista = 'inicio', F = null, ACTIVA = false, ULT = 0;
let qCli = '', qHis = '', HLIM = 50, CFGLOGO;
const ABIERTAS = new Set();
let CV = null, FACT_ACTUAL = null, MODAL_CB = null;

const configurado = /^https:\/\/.+/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;
const db = configurado ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* Logo por defecto (se dibuja con código, sin archivos) */
function crearLogoDefecto() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#6d28d9';
  rr(x, 0, 0, 256, 256, 56);
  x.fill();
  x.strokeStyle = '#fff';
  x.lineWidth = 12;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath(); x.arc(82, 170, 30, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(176, 170, 30, 0, Math.PI * 2); x.stroke();
  x.beginPath();
  x.moveTo(82, 170); x.lineTo(116, 108); x.lineTo(152, 108); x.lineTo(176, 170);
  x.moveTo(116, 108); x.lineTo(104, 86); x.lineTo(132, 86);
  x.moveTo(152, 108); x.lineTo(168, 84); x.lineTo(192, 84);
  x.stroke();
  return c.toDataURL('image/png');
}
const LOGO_DEFECTO = crearLogoDefecto();
const logoSrc = () => S.config.logo_url || LOGO_DEFECTO;

function aplicarMarca() {
  document.querySelectorAll('.logo-img').forEach(i => i.src = logoSrc());
  document.querySelectorAll('.nombre-taller').forEach(i => i.textContent = S.config.nombre_taller);
  document.title = S.config.nombre_taller;
}

/* ===================== Datos (Supabase) ===================== */
async function fetchAll(tabla, orden) {
  let todo = [], desde = 0;
  while (true) {
    let q = db.from(tabla).select('*').range(desde, desde + 999);
    orden.forEach(o => { q = q.order(o.c, {ascending:o.asc}); });
    const {data, error} = await q;
    if (error) throw error;
    todo = todo.concat(data);
    if (data.length < 1000) break;
    desde += 1000;
  }
  return todo;
}

async function cargarDatos() {
  const [c, m, f, cfg] = await Promise.all([
    fetchAll('clientes', [{c:'nombre', asc:true}, {c:'id', asc:true}]),
    fetchAll('motos', [{c:'placa', asc:true}]),
    fetchAll('facturas', [{c:'numero', asc:false}]),
    db.from('configuracion').select('*').eq('id', 1).maybeSingle()
  ]);
  if (cfg.error) throw cfg.error;
  S.clientes = c;
  S.motos = m;
  S.facturas = f;
  S.config = {...CFG_DEF, ...(cfg.data || {})};
  ULT = Date.now();
}

/* ===================== Acceso ===================== */
function pantallaAviso(html) {
  $('#login').classList.add('hidden');
  $('#app').classList.add('hidden');
  const p = $('#aviso-pantalla');
  p.innerHTML = `<div class="caja">${html}</div>`;
  p.classList.remove('hidden');
}

function mostrarLogin(msg) {
  ACTIVA = false;
  $('#aviso-pantalla').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#lg-err').textContent = msg || '';
  document.querySelectorAll('.logo-img').forEach(i => i.src = LOGO_DEFECTO);
}

function mostrarApp() {
  $('#aviso-pantalla').classList.add('hidden');
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  aplicarMarca();
  render();
}

async function entrar(ev) {
  ev.preventDefault();
  const email = $('#lg-email').value.trim();
  const pass = $('#lg-pass').value;
  const b = $('#lg-btn');
  $('#lg-err').textContent = '';
  b.disabled = true;
  b.textContent = 'Entrando...';
  const {error} = await db.auth.signInWithPassword({email, password:pass});
  if (error) {
    $('#lg-err').textContent = 'Correo o contraseña incorrectos.';
  } else {
    await entrarApp();
  }
  b.disabled = false;
  b.textContent = 'Entrar';
  return false;
}

async function entrarApp() {
  const {data:ok, error} = await db.rpc('es_autorizado');
  if (error) {
    await db.auth.signOut();
    return mostrarLogin('No se pudo verificar el acceso. Revisa que ya ejecutaste el SQL en Supabase.');
  }
  if (ok !== true) {
    await db.auth.signOut();
    return mostrarLogin('Este usuario no tiene autorización para entrar.');
  }
  try {
    await cargarDatos();
  } catch (e) {
    return pantallaAviso(`<h2>No se pudieron cargar los datos</h2><p>${esc(msgErr(e))}</p><button class="btn" onclick="location.reload()">Reintentar</button>`);
  }
  ACTIVA = true;
  const em = (await db.auth.getUser()).data.user?.email || '';
  $('#usuario-side').textContent = em;
  vista = 'inicio';
  mostrarApp();
}

async function salir() {
  await db.auth.signOut();
  S.clientes = []; S.motos = []; S.facturas = [];
  S.config = {...CFG_DEF};
  mostrarLogin();
}

/* ===================== Navegación ===================== */
const ICONOS = {
  inicio:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',
  clientes:'M9 4.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .7 3.5 2.6 3.5 5.5',
  nueva:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',
  historial:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',
  config:'M4 7h10M18 7h2M4 17h2M10 17h10M16 5a2 2 0 100 4 2 2 0 000-4zM8 15a2 2 0 100 4 2 2 0 000-4z'
};
const MENU = [['inicio','Inicio'], ['clientes','Clientes'], ['nueva','Nueva factura'], ['historial','Historial'], ['config','Configuración']];
const ico = k => `<svg class="ico" viewBox="0 0 24 24"><path d="${ICONOS[k]}"/></svg>`;

function pintarMenus() {
  const h = MENU.map(([k, t]) => `<button class="${k === vista ? 'on' : ''}" onclick="ir('${k}')">${ico(k)}<span>${t}</span></button>`).join('');
  $('#menu-side').innerHTML = h;
  $('#menu-bottom').innerHTML = h;
}

function ir(v) {
  if (v === 'nueva' && vista !== 'nueva') F = nuevaEstado();
  else if (v === 'nueva' && F && F.id) F = nuevaEstado();
  vista = v;
  render();
  window.scrollTo(0, 0);
}

function irNueva(placa) {
  F = nuevaEstado(placa);
  vista = 'nueva';
  render();
  window.scrollTo(0, 0);
}

function render() {
  pintarMenus();
  const vistas = {inicio:vInicio, clientes:vClientes, nueva:vNueva, historial:vHistorial, config:vConfig};
  $('#vista').innerHTML = vistas[vista]();
  if (vista === 'clientes') pintarClientes();
  if (vista === 'historial') pintarHistorial();
  if (vista === 'nueva') { pintarPlaca(); pintarTrabajos(); pintarInsumos(); pintarRep(); calcTotal(); }
}

/* ===================== Ventanas ===================== */
function abrirModal(titulo, html, ancho, alCerrar) {
  cerrarModal(true);
  MODAL_CB = alCerrar || null;
  $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal ${ancho ? 'ancho' : ''}"><div class="mh"><h2>${esc(titulo)}</h2><button type="button" class="cerrar" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
}

function cerrarModal(silencioso) {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
  const cb = MODAL_CB;
  MODAL_CB = null;
  if (cb && !silencioso) cb();
}

/* ===================== INICIO ===================== */
function stat(t, v) { return `<div class="card stat"><small>${esc(t)}</small><b>${esc(v)}</b></div>`; }

function filaFact(f) {
  return `<div class="fila" onclick="verFactura('${f.id}')">
    <div><b>#${num4(f.numero)}</b> <span class="placa sm">${esc(f.placa)}</span>
    <div class="mut">${fechaCorta(f.fecha)} · ${esc(f.cliente_nombre)} · ${esc(f.marca)} ${esc(f.modelo)}</div></div>
    <div class="monto">${pesos(f.total)}</div></div>`;
}

function verFactura(id) {
  const f = S.facturas.find(x => x.id === id);
  if (f) abrirFactura(f);
}

function vInicio() {
  const mes = hoyISO().slice(0, 7);
  const delMes = S.facturas.filter(f => f.fecha.slice(0, 7) === mes);
  const nm = new Date().toLocaleDateString('es-CO', {month:'long', year:'numeric'});
  return `<div class="cab"><h1>Inicio</h1><button class="btn" onclick="ir('nueva')">+ Crear nueva factura</button></div>
  <div class="g3">
    ${stat('Total de servicios realizados', S.facturas.length)}
    ${stat('Facturación de ' + nm, pesos(sumar(delMes, 'total')))}
    ${stat('Facturación acumulada', pesos(sumar(S.facturas, 'total')))}
  </div>
  <div class="card"><h2>Últimos servicios</h2>
    ${S.facturas.length ? S.facturas.slice(0, 5).map(filaFact).join('') : '<p class="mut">Todavía no hay facturas. Crea la primera con el botón de arriba.</p>'}
  </div>`;
}

/* ===================== CLIENTES Y MOTOS ===================== */
const motosDe = id => S.motos.filter(m => m.cliente_id === id);

function vClientes() {
  return `<div class="cab"><h1>Clientes y motos</h1><button class="btn" onclick="modalCliente()">+ Nuevo cliente</button></div>
  <input id="q-cli" placeholder="Buscar por placa, nombre o teléfono" value="${esc(qCli)}" oninput="qCli=this.value;pintarClientes()">
  <div class="mt" id="lista-cli"></div>`;
}

function pintarClientes() {
  const t = qCli.trim().toLowerCase();
  const p = limpiarPlaca(qCli);
  const lista = S.clientes.filter(c => !t || c.nombre.toLowerCase().includes(t) || (c.telefono || '').includes(t) || (p && motosDe(c.id).some(m => m.placa.includes(p))));
  $('#lista-cli').innerHTML = lista.length ? lista.map(tarjetaCliente).join('') : `<div class="card vacio">${S.clientes.length ? 'No hay resultados.' : 'Aún no hay clientes. Crea el primero con el botón "+ Nuevo cliente".'}</div>`;
}

function tarjetaCliente(c) {
  const ms = motosDe(c.id);
  return `<div class="card">
    <div class="cab2">
      <div><div class="nom">${esc(c.nombre)}</div><div class="mut">${esc(c.telefono) || 'Sin teléfono'}</div></div>
      <div class="bt">
        <button class="btn sec sm" onclick="modalCliente('${c.id}')">Editar</button>
        <button class="btn sec sm" onclick="modalMoto('${c.id}')">+ Moto</button>
        <button class="btn red sm" onclick="eliminarCliente('${c.id}')">Eliminar</button>
      </div>
    </div>
    ${ms.length ? ms.map(bloqueMoto).join('') : '<p class="mut">Sin motos registradas.</p>'}
  </div>`;
}

function bloqueMoto(m) {
  const abierta = ABIERTAS.has(m.id);
  let det = '';
  if (abierta) {
    const fs = S.facturas.filter(f => f.moto_id === m.id);
    det = '<div class="serv">' + (fs.length
      ? fs.map(f => `<div class="fila" onclick="verFactura('${f.id}')"><div><b>#${num4(f.numero)}</b> <span class="mut">${fechaCorta(f.fecha)} · ${esc((f.trabajos || []).map(t => t.descripcion).join(', ').slice(0, 70))}</span></div><div class="monto">${pesos(f.total)}</div></div>`).join('') + `<div class="tr">Total en esta moto: <b>${pesos(sumar(fs, 'total'))}</b></div>`
      : '<p class="mut" style="padding:8px">Esta moto aún no tiene servicios.</p>') + '</div>';
  }
  return `<div class="moto">
    <div class="cab2">
      <div><span class="placa">${esc(m.placa)}</span> <b>${esc(m.marca)} ${esc(m.modelo)}</b></div>
      <div class="bt">
        <button class="btn sec sm" onclick="alternarServicios('${m.id}')">${abierta ? 'Ocultar servicios' : 'Ver servicios'}</button>
        <button class="btn sm" onclick="irNueva('${esc(m.placa)}')">Facturar</button>
        <button class="btn sec sm" onclick="modalMoto('${m.cliente_id}','${m.id}')">Editar</button>
        <button class="btn red sm" onclick="eliminarMoto('${m.id}')">Eliminar</button>
      </div>
    </div>${det}</div>`;
}

function alternarServicios(id) {
  if (ABIERTAS.has(id)) ABIERTAS.delete(id); else ABIERTAS.add(id);
  pintarClientes();
}

function modalCliente(id) {
  const c = id ? S.clientes.find(x => x.id === id) : null;
  const moto = c ? '' : `<h2 class="mt">Su moto</h2>
    <label>Placa</label><input id="mc-placa" class="mono" maxlength="7" autocapitalize="characters" oninput="this.value=limpiarPlaca(this.value)">
    <div class="g2 mt"><div><label>Marca</label><input id="mc-marca"></div><div><label>Modelo</label><input id="mc-modelo"></div></div>`;
  abrirModal(c ? 'Editar cliente' : 'Nuevo cliente',
    `<label>Nombre del cliente</label><input id="mc-nombre" value="${esc(c?.nombre)}">
     <div class="mt"><label>Teléfono</label><input id="mc-tel" inputmode="tel" value="${esc(c?.telefono)}"></div>
     ${moto}<p class="err" id="mc-err"></p>
     <div class="acc"><button class="btn sec" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mc-ok" onclick="guardarCliente('${id || ''}')">Guardar</button></div>`);
}

async function guardarCliente(id) {
  const v = k => $('#' + k).value.trim();
  const err = $('#mc-err');
  err.textContent = '';
  const nombre = v('mc-nombre'), tel = v('mc-tel');
  if (!nombre) { err.textContent = 'Escribe el nombre del cliente.'; return; }
  let placa, marca, modelo;
  if (!id) {
    placa = limpiarPlaca($('#mc-placa').value);
    marca = v('mc-marca');
    modelo = v('mc-modelo');
    if (!placa || !marca || !modelo) { err.textContent = 'Completa la placa, marca y modelo de la moto.'; return; }
    if (S.motos.some(m => m.placa === placa)) { err.textContent = 'Esa placa ya está registrada.'; return; }
  }
  const btn = $('#mc-ok');
  btn.disabled = true;
  try {
    if (id) {
      const r1 = await db.from('clientes').update({nombre, telefono:tel}).eq('id', id);
      if (r1.error) throw r1.error;
      const r2 = await db.from('facturas').update({cliente_nombre:nombre, cliente_telefono:tel}).eq('cliente_id', id);
      if (r2.error) throw r2.error;
    } else {
      const {data:c, error} = await db.from('clientes').insert({nombre, telefono:tel}).select().single();
      if (error) throw error;
      const r2 = await db.from('motos').insert({cliente_id:c.id, placa, marca, modelo});
      if (r2.error) {
        await db.from('clientes').delete().eq('id', c.id);
        throw r2.error;
      }
    }
    cerrarModal();
    await cargarDatos();
    render();
    toast('Guardado');
  } catch (e) {
    err.textContent = msgErr(e);
    btn.disabled = false;
  }
}

function modalMoto(clienteId, motoId) {
  const m = motoId ? S.motos.find(x => x.id === motoId) : null;
  abrirModal(m ? 'Editar moto' : 'Agregar moto',
    `<label>Placa</label><input id="mm-placa" class="mono" maxlength="7" autocapitalize="characters" value="${esc(m?.placa)}" oninput="this.value=limpiarPlaca(this.value)">
     <div class="g2 mt"><div><label>Marca</label><input id="mm-marca" value="${esc(m?.marca)}"></div><div><label>Modelo</label><input id="mm-modelo" value="${esc(m?.modelo)}"></div></div>
     <p class="err" id="mm-err"></p>
     <div class="acc"><button class="btn sec" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mm-ok" onclick="guardarMoto('${clienteId}','${motoId || ''}')">Guardar</button></div>`);
}

async function guardarMoto(clienteId, motoId) {
  const err = $('#mm-err');
  err.textContent = '';
  const placa = limpiarPlaca($('#mm-placa').value);
  const marca = $('#mm-marca').value.trim();
  const modelo = $('#mm-modelo').value.trim();
  if (!placa || !marca || !modelo) { err.textContent = 'Completa la placa, marca y modelo.'; return; }
  if (S.motos.some(m => m.placa === placa && m.id !== motoId)) { err.textContent = 'Esa placa ya está registrada.'; return; }
  const btn = $('#mm-ok');
  btn.disabled = true;
  try {
    if (motoId) {
      const r1 = await db.from('motos').update({placa, marca, modelo}).eq('id', motoId);
      if (r1.error) throw r1.error;
      const r2 = await db.from('facturas').update({placa, marca, modelo}).eq('moto_id', motoId);
      if (r2.error) throw r2.error;
    } else {
      const r = await db.from('motos').insert({cliente_id:clienteId, placa, marca, modelo});
      if (r.error) throw r.error;
    }
    cerrarModal();
    await cargarDatos();
    render();
    toast('Guardado');
  } catch (e) {
    err.textContent = msgErr(e);
    btn.disabled = false;
  }
}

async function eliminarCliente(id) {
  const c = S.clientes.find(x => x.id === id);
  if (!confirm(`¿Eliminar a ${c.nombre} y sus motos? Las facturas ya hechas se conservan en el historial.`)) return;
  const {error} = await db.from('clientes').delete().eq('id', id);
  if (error) return toast(msgErr(error));
  await cargarDatos();
  render();
}

async function eliminarMoto(id) {
  const m = S.motos.find(x => x.id === id);
  if (!confirm(`¿Eliminar la moto ${m.placa}? Las facturas ya hechas se conservan en el historial.`)) return;
  const {error} = await db.from('motos').delete().eq('id', id);
  if (error) return toast(msgErr(error));
  await cargarDatos();
  render();
}

}

function vNueva() {

  <div class="card"><h2>Datos de la factura</h2>

function camposMoto(nueva) {

    <select onchange="F.clienteSel=this.value;pintarPlaca()">
      <option value="">No, es un cliente nuevo</option>

      <div><label>Teléfono</label><input inputmode="tel" value="${esc(F.tel)}" oninput="F.tel=this.value"></div>

    ${sel}${cli}
    <div class="g2">
      <div><label>Marca de la moto</label><input value="${esc(F.marca)}" oninput="F.marca=this.value"></div>

function pintarPlaca() {
  const box = $('#placa-box');
  if (!box) return;
  if (F.id) { box.innerHTML = camposMoto(false); return; }
  const p = F.placa;
  const m = S.motos.find(x => x.placa === p);
  if (m) {
    const c = S.clientes.find(x => x.id === m.cliente_id) || {};
    box.innerHTML = `<div class="info">
      <div><small>MOTO REGISTRADA</small><b>${esc(m.marca)} ${esc(m.modelo)}</b></div>
      <div><small>CLIENTE</small><b>${esc(c.nombre)}</b><span class="mut">${esc(c.telefono)}</span></div></div>`;
  } else if (p.length >= 5) {
    box.innerHTML = camposMoto(true);
  } else {
    box.innerHTML = '';
  }
}

function siNo(v, fn) {
  return `<div class="sino"><button type="button" class="${v ? 'on' : ''}" onclick="${fn}(true)">Sí</button><button type="button" class="${!v ? 'on' : ''}" onclick="${fn}(false)">No</button></div>`;
}

function enfocarUltima(selector) {
  const l = document.querySelectorAll(selector);
  if (l.length) l[l.length - 1].querySelector('input').focus();
}

function pintarTrabajos() {
  $('#trab-list').innerHTML = F.trabajos.map((t, i) => `<div class="linea">
    <input placeholder="Descripción del trabajo" value="${esc(t.descripcion)}" oninput="F.trabajos[${i}].descripcion=this.value">
    <input class="pr" type="number" inputmode="numeric" min="0" placeholder="Precio" value="${esc(t.precio)}" oninput="F.trabajos[${i}].precio=this.value;calcTotal()">
    <button type="button" class="x" onclick="quitarTrabajo(${i})" aria-label="Quitar">×</button></div>`).join('');
}
function addTrabajo() { F.trabajos.push({descripcion:'', precio:''}); pintarTrabajos(); enfocarUltima('#trab-list .linea'); }
function quitarTrabajo(i) {
  F.trabajos = F.trabajos.length === 1 ? [{descripcion:'', precio:''}] : F.trabajos.filter((_, j) => j !== i);
  pintarTrabajos();
  calcTotal();
}

function pintarInsumos() {
  $('#ins-box').innerHTML = siNo(F.conInsumos, 'setIns') + (F.conInsumos
    ? `<div class="mt" style="max-width:320px"><label>Valor fijo de insumos (puedes cambiarlo)</label>
       <input type="number" inputmode="numeric" min="0" placeholder="Ej: 10000" value="${esc(F.insumos)}" oninput="F.insumos=this.value;calcTotal()"></div>` : '');
}
function setIns(v) {
  F.conInsumos = v;
  if (v && F.insumos === '') { try { F.insumos = localStorage.getItem('ct_insumos') || ''; } catch (e) {} }
  pintarInsumos();
  calcTotal();
}

function pintarRep() {
  $('#rep-box').innerHTML = siNo(F.conRep, 'setRep') + (F.conRep
    ? `<div class="mt" id="rep-list">${F.repuestos.map((r, i) => `<div class="linea">
        <input placeholder="Nombre del repuesto" value="${esc(r.nombre)}" oninput="F.repuestos[${i}].nombre=this.value">
        <input class="pr" type="number" inputmode="numeric" min="0" placeholder="Precio" value="${esc(r.precio)}" oninput="F.repuestos[${i}].precio=this.value;calcTotal()">
        <button type="button" class="x" onclick="quitarRep(${i})" aria-label="Quitar">×</button></div>`).join('')}</div>
      <button type="button" class="btn sec" onclick="addRep()">+ Agregar repuesto</button>` : '');
}
function setRep(v) { F.conRep = v; pintarRep(); calcTotal(); }
function addRep() { F.repuestos.push({nombre:'', precio:''}); pintarRep(); enfocarUltima('#rep-list .linea'); }
function quitarRep(i) {
  F.repuestos = F.repuestos.length === 1 ? [{nombre:'', precio:''}] : F.repuestos.filter((_, j) => j !== i);
  pintarRep();
  calcTotal();
}

function datosFactura() {
  const tr = F.trabajos.filter(t => t.descripcion.trim() || Number(t.precio)).map(t => ({descripcion:t.descripcion.trim(), precio:pos(t.precio)}));
  const rp = F.conRep ? F.repuestos.filter(r => r.nombre.trim() || Number(r.precio)).map(r => ({nombre:r.nombre.trim(), precio:pos(r.precio)})) : [];
  const ins = F.conInsumos ? pos(F.insumos) : 0;
  return {tr, rp, ins, total:sumar(tr) + ins + sumar(rp)};
}

function calcTotal() {
  const box = $('#tot-box');
  if (!box) return;
  const d = datosFactura();
  let h = `<div class="fl"><span>Trabajos</span><span>${pesos(sumar(d.tr))}</span></div>`;
  if (d.ins > 0) h += `<div class="fl"><span>Insumos</span><span>${pesos(d.ins)}</span></div>`;
  if (d.rp.length) h += `<div class="fl"><span>Repuestos</span><span>${pesos(sumar(d.rp))}</span></div>`;
  h += `<div class="total"><span>TOTAL</span><b>${pesos(d.total)}</b></div>`;
  box.innerHTML = h;
}

async function guardarFactura() {
  const err = $('#err-fact');
  const btn = $('#btn-guardar');
  err.textContent = '';
  const d = datosFactura();
  if (!F.placa) { err.textContent = 'Escribe la placa de la moto.'; return; }
  if (!F.fecha) { err.textContent = 'Elige la fecha.'; return; }
  if (!d.tr.length) { err.textContent = 'Agrega al menos un trabajo realizado.'; return; }
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  let clienteNuevoId = null, motoCreada = false;
  try {
    const base = {fecha:F.fecha, trabajos:d.tr, insumos:d.ins, repuestos:d.rp, total:d.total};
    let fila;
    if (F.id) {
      const {data, error} = await db.from('facturas').update({
        ...base, cliente_nombre:F.nombre.trim(), cliente_telefono:F.tel.trim(),
        marca:F.marca.trim(), modelo:F.modelo.trim()
      }).eq('id', F.id).select().single();
      if (error) throw error;
      fila = data;
    } else {
      let moto = S.motos.find(m => m.placa === F.placa);
      let cli, snap, motoId;
      if (moto) {
        cli = S.clientes.find(c => c.id === moto.cliente_id) || {};
        motoId = moto.id;
        snap = {cliente_nombre:cli.nombre || '', cliente_telefono:cli.telefono || '', marca:moto.marca, modelo:moto.modelo};
      } else {
        if (F.placa.length < 5) throw new Error('La placa parece incompleta.');
        if (!F.marca.trim() || !F.modelo.trim()) throw new Error('Escribe la marca y el modelo de la moto.');
        if (F.clienteSel) {
          cli = S.clientes.find(c => c.id === F.clienteSel);
        } else {
          if (!F.nombre.trim()) throw new Error('Escribe el nombre del cliente.');
          const r = await db.from('clientes').insert({nombre:F.nombre.trim(), telefono:F.tel.trim()}).select().single();
          if (r.error) throw r.error;
          cli = r.data;
          clienteNuevoId = cli.id;
        }
        const rm = await db.from('motos').insert({cliente_id:cli.id, placa:F.placa, marca:F.marca.trim(), modelo:F.modelo.trim()}).select().single();
        if (rm.error) throw rm.error;
        motoCreada = true;
        motoId = rm.data.id;
        snap = {cliente_nombre:cli.nombre, cliente_telefono:cli.telefono || '', marca:rm.data.marca, modelo:rm.data.modelo};
      }
      const {data, error} = await db.from('facturas').insert({
        ...base, ...snap, placa:F.placa, cliente_id:cli.id, moto_id:motoId
      }).select().single();
      if (error) throw error;
      fila = data;
    }
    if (d.ins > 0) { try { localStorage.setItem('ct_insumos', String(d.ins)); } catch (e) {} }
    await cargarDatos();
    btn.disabled = false;
    btn.textContent = F.id ? 'Guardar cambios' : 'Guardar factura';
    abrirFactura(fila, () => ir('historial'));
  } catch (e) {
    if (clienteNuevoId && !motoCreada) await db.from('clientes').delete().eq('id', clienteNuevoId);
    err.textContent = msgErr(e);
    btn.disabled = false;
    btn.textContent = F.id ? 'Guardar cambios' : 'Guardar factura';
  }
}

/* ===================== HISTORIAL ===================== */
function vHistorial() {
  return `<h1>Historial de facturas</h1>
  <input id="q-his" placeholder="Buscar por placa o cliente" value="${esc(qHis)}" oninput="qHis=this.value;HLIM=50;pintarHistorial()">
  <div class="mt" id="his-res"></div>`;
}

function pintarHistorial() {
  const t = qHis.trim().toLowerCase();
  const p = limpiarPlaca(qHis);
  let l = S.facturas;
  if (t) l = l.filter(f => (p && f.placa.includes(p)) || (f.cliente_nombre || '').toLowerCase().includes(t));
  const vis = l.slice(0, HLIM);
  let h = '';
  if (l.length) h += `<p class="mut">${l.length} ${l.length === 1 ? 'factura' : 'facturas'} · Suma: ${pesos(sumar(l, 'total'))}</p>`;
  if (!l.length) {
    h = `<div class="card vacio">${S.facturas.length ? 'No hay facturas con esa búsqueda.' : 'Todavía no hay facturas.'}</div>`;

    h += vis.map(f => `<div class="card hcard">

        <div class="mut">${esc((f.trabajos || []).map(x => x.descripcion).join(', ').slice(0, 90))}</div>

      </div>
      <div class="bt">
        <button class="btn sm" onclick="verFactura('${f.id}')">Ver / Descargar</button>
        <button class="btn sec sm" onclick="editarFactura('${f.id}')">Editar</button>
        <button class="btn red sm" onclick="eliminarFactura('${f.id}')">Eliminar</button>
      </div></div>`).join('');
    if (l.length > HLIM) h += `<button class="btn sec blq" onclick="HLIM+=50;pintarHistorial()">Ver más facturas</button>`;
  }
  $('#his-res').innerHTML = h;
}

/* ===================== FACTURA: DIBUJO, PDF Y PNG ===================== */
function cargarImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

function envolver(x, texto, max) {
  const palabras = String(texto).split(/\s+/).filter(Boolean);
  const lineas = [];
  let l = '';
  palabras.forEach(pal => {
    let p = pal;
    const t = l ? l + ' ' + p : p;
    if (x.measureText(t).width <= max) { l = t; return; }
    if (l) lineas.push(l);
    while (x.measureText(p).width > max && p.length > 1) {
      let i = p.length;
      while (i > 1 && x.measureText(p.slice(0, i)).width > max) i--;
      lineas.push(p.slice(0, i));
      p = p.slice(i);
    }
    l = p;
  });
  if (l) lineas.push(l);
  return lineas.length ? lineas : [''];
}

function dibujar(x, f, img, W, H) {
  const cfg = S.config;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const set = (size, peso, color) => { x.font = `${peso} ${size}px ${FONT}`; x.fillStyle = color; };
  const ajustado = (txt, max, size, peso, color) => {
    let s = size;
    set(s, peso, color);
    while (s > 12 && x.measureText(txt).width > max) { s--; set(s, peso, color); }
  };
  x.textBaseline = 'alphabetic';

  // Fondo
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, W, H);

  // Encabezado
  x.fillStyle = '#6d28d9';
  x.fillRect(0, 0, W, 150);
  x.fillStyle = '#ffffff';
  rr(x, 40, 35, 80, 80, 16);
  x.fill();
  if (img) {
    const bw = 64;
    const r = Math.min(bw / img.width, bw / img.height);
    const w = img.width * r, h = img.height * r;
    x.drawImage(img, 48 + (bw - w) / 2, 43 + (bw - h) / 2, w, h);
  }
  x.textAlign = 'left';
  ajustado(cfg.nombre_taller, 400, 28, '800', '#ffffff');
  x.fillText(cfg.nombre_taller, 140, 72);
  if (cfg.telefono) { ajustado('Tel: ' + cfg.telefono, 400, 14, '400', '#ddd6fe'); x.fillText('Tel: ' + cfg.telefono, 140, 98); }
  if (cfg.direccion) { ajustado(cfg.direccion, 400, 14, '400', '#ddd6fe'); x.fillText(cfg.direccion, 140, 118); }
  x.textAlign = 'right';
  set(13, '700', '#ddd6fe'); x.fillText('FACTURA', 760, 50);
  set(30, '800', '#ffffff'); x.fillText('N° ' + num4(f.numero), 760, 86);
  set(14, '400', '#ede9fe'); x.fillText(fechaLarga(f.fecha), 760, 112);

  // Cliente y moto
  x.fillStyle = '#f5f3ff';
  rr(x, 40, 175, 720, 96, 16);
  x.fill();
  x.textAlign = 'left';
  set(11, '700', '#6d28d9'); x.fillText('CLIENTE', 64, 200);
  ajustado(f.cliente_nombre || '-', 330, 18, '700', '#1e1b2e'); x.fillText(f.cliente_nombre || '-', 64, 226);
  if (f.cliente_telefono) { set(14, '400', '#6b7280'); x.fillText(f.cliente_telefono, 64, 250); }
  set(11, '700', '#6d28d9'); x.fillText('MOTOCICLETA', 420, 200);
  const mm = [f.marca, f.modelo].filter(Boolean).join(' ') || '-';
  ajustado(mm, 320, 18, '700', '#1e1b2e'); x.fillText(mm, 420, 226);
  set(14, '400', '#6b7280'); x.fillText('Placa: ' + f.placa, 420, 250);

  // Tablas
  let y = 305;
  const tabla = (titulo, col, filas, key) => {
    x.textAlign = 'left';
    set(11, '700', '#6d28d9'); x.fillText(titulo, 40, y);
    y += 8;
    set(13, '600', '#6b7280'); x.fillText(col, 40, y + 16);
    x.textAlign = 'right'; x.fillText('Valor', 760, y + 16);
    x.textAlign = 'left';
    y += 26;
    x.fillStyle = '#ddd6fe'; x.fillRect(40, y, 720, 2);
    y += 6;
    filas.forEach(r => {
      set(15, '400', '#1e1b2e');
      const lineas = envolver(x, r[key] || '', 540);
      lineas.forEach((l, i) => x.fillText(l, 40, y + 20 + i * 20));
      x.textAlign = 'right';
      set(15, '400', '#1e1b2e');
      x.fillText(pesos(r.precio), 760, y + 20);
      x.textAlign = 'left';
      y += lineas.length * 20 + 16;
      x.fillStyle = '#f1edff'; x.fillRect(40, y - 4, 720, 1);
    });
    y += 26;
  };
  tabla('TRABAJOS REALIZADOS', 'Descripción', f.trabajos || [], 'descripcion');
  if ((f.repuestos || []).length) tabla('REPUESTOS', 'Repuesto', f.repuestos, 'nombre');

  // Totales
  const tot = [['Trabajos', sumar(f.trabajos)]];
  if (Number(f.insumos) > 0) tot.push(['Insumos', Number(f.insumos)]);
  if ((f.repuestos || []).length) tot.push(['Repuestos', sumar(f.repuestos)]);
  tot.forEach(([a, b]) => {
    x.textAlign = 'left'; set(14, '400', '#6b7280'); x.fillText(a, 460, y + 14);
    x.textAlign = 'right'; set(14, '400', '#1e1b2e'); x.fillText(pesos(b), 760, y + 14);
    y += 26;
  });
  y += 8;
  x.fillStyle = '#6d28d9';
  rr(x, 440, y, 320, 64, 14);
  x.fill();
  x.textAlign = 'left'; set(15, '700', '#ffffff'); x.fillText('TOTAL', 464, y + 38);
  x.textAlign = 'right'; set(26, '800', '#ffffff'); x.fillText(pesos(f.total), 736, y + 42);
  y += 64;

  // Pie
  x.fillStyle = '#f5f3ff';
  x.fillRect(0, H - 70, W, 70);
  x.textAlign = 'center';
  ajustado(cfg.nota_pie || '¡Gracias por confiar en nosotros!', 700, 15, '700', '#6d28d9');
  x.fillText(cfg.nota_pie || '¡Gracias por confiar en nosotros!', W / 2, H - 28);

  return y + 40 + 70;
}

async function facturaCanvas(f) {
  const img = await cargarImg(logoSrc());
  const W = 800, E = 2;
  const medida = document.createElement('canvas').getContext('2d');
  const H = Math.max(1131, Math.ceil(dibujar(medida, f, img, W, 5000)));
  const c = document.createElement('canvas');
  c.width = W * E;
  c.height = H * E;
  const x = c.getContext('2d');
  x.scale(E, E);
  dibujar(x, f, img, W, H);
  return c;
}

async function abrirFactura(f, alCerrar) {
  FACT_ACTUAL = f;
  CV = null;
  abrirModal('Factura N° ' + num4(f.numero),
    `<div class="acc" style="justify-content:flex-start;margin:0 0 12px">
      <button class="btn" id="b-pdf" onclick="descargarPDF()" disabled>Descargar PDF</button>
      <button class="btn" id="b-png" onclick="descargarPNG()" disabled>Descargar PNG</button>
      <button class="btn sec" onclick="cerrarModal()">Cerrar</button>
     </div>
     <p class="err" id="fa-err"></p>
     <div class="prev" id="prev"><p class="mut">Generando factura...</p></div>`, true, alCerrar);
  try {
    CV = await facturaCanvas(f);
    const p = $('#prev');
    if (!p) return;
    p.innerHTML = '';
    p.appendChild(CV);
    $('#b-pdf').disabled = false;
    $('#b-png').disabled = false;
  } catch (e) {
    const er = $('#fa-err');
    if (er) er.textContent = 'No se pudo generar la factura. Intenta de nuevo.';
  }
}

const nombreArchivo = f => `Factura-${num4(f.numero)}-${f.placa}`;

function bajar(blob, nombre) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}

function descargarPNG() {
  if (!CV) return;
  CV.toBlob(b => { if (b) bajar(b, nombreArchivo(FACT_ACTUAL) + '.png'); }, 'image/png');
}

function descargarPDF() {
  if (!CV) return;
  if (!window.jspdf) { $('#fa-err').textContent = 'No se pudo cargar el generador de PDF. Revisa tu conexión a internet.'; return; }
  const w = 595.28;
  const h = w * CV.height / CV.width;
  const pdf = new window.jspdf.jsPDF({unit:'pt', format:[w, h], orientation:'portrait'});
  pdf.addImage(CV.toDataURL('image/png'), 'PNG', 0, 0, w, h);
  pdf.save(nombreArchivo(FACT_ACTUAL) + '.pdf');
}

function leerLogo(archivo) {
  return new Promise((res, rej) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const a = img.naturalWidth || 400, h = img.naturalHeight || 400;
        const e = Math.min(1, 400 / Math.max(a, h));
        const c = document.createElement('canvas');
        c.width = Math.round(a * e);
        c.height = Math.round(h * e);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png'));
      };
      img.onerror = () => rej(new Error('La imagen no es válida.'));
      img.src = lector.result;
    };
    lector.onerror = () => rej(new Error('No se pudo leer el archivo.'));
    lector.readAsDataURL(archivo);
  });
}

async function elegirLogo(inp) {
  const a = inp.files && inp.files[0];
  if (!a) return;
  try {
    CFGLOGO = await leerLogo(a);
    $('#cf-logo').src = CFGLOGO;
    $('#cf-err').textContent = '';
  } catch (e) {
    $('#cf-err').textContent = e.message;
  }
}

function quitarLogo() {
  CFGLOGO = null;
  $('#cf-logo').src = LOGO_DEFECTO;
}

async function guardarConfig() {
  const err = $('#cf-err'), ok = $('#cf-ok'), btn = $('#cf-btn');
  err.textContent = ''; ok.textContent = '';
  btn.disabled = true;
  const cambios = {
    nombre_taller:$('#cf-nombre').value.trim() || 'Chewbbie Taller',
    telefono:$('#cf-tel').value.trim(),
    direccion:$('#cf-dir').value.trim(),
    nota_pie:$('#cf-pie').value.trim(),
    logo_url:CFGLOGO === undefined ? (S.config.logo_url || null) : CFGLOGO
  };
  const {error} = await db.from('configuracion').upsert({id:1, ...cambios});
  btn.disabled = false;
  if (error) { err.textContent = msgErr(error); return; }
  S.config = {...S.config, ...cambios};
  CFGLOGO = undefined;
  aplicarMarca();
  ok.textContent = 'Cambios guardados.';
}

async function cambiarClave() {
  const a = $('#pw1').value, b = $('#pw2').value;
  const err = $('#pw-err'), ok = $('#pw-ok');
  err.textContent = ''; ok.textContent = '';
  if (a.length < 8) { err.textContent = 'La contraseña debe tener mínimo 8 caracteres.'; return; }
  if (a !== b) { err.textContent = 'Las contraseñas no coinciden.'; return; }
  const {error} = await db.auth.updateUser({password:a});
  if (error) { err.textContent = error.message; return; }
  ok.textContent = 'Contraseña actualizada.';
  $('#pw1').value = '';
  $('#pw2').value = '';
}

function respaldo() {
  const o = {
    fecha:new Date().toISOString(),
    clientes:S.clientes, motos:S.motos, facturas:S.facturas,
    configuracion:{...S.config, logo_url:undefined}
  };
  bajar(new Blob([JSON.stringify(o, null, 2)], {type:'application/json'}), `respaldo-chewbbie-${hoyISO()}.json`);
}
